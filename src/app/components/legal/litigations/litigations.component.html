<div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between page-header !py-4">
  <div>
    <h3 class="ov-page-title">Litigations</h3>
    <p class="ov-page-sub">{{filteredData.length || 0}} litigations registered</p>
  </div>
  <div class="flex flex-wrap gap-2 items-center mt-2 md:mt-0">
    <button type="button" class="ov-btn ov-btn-ghost" data-tooltip="Export">
      <img src="assets/images/work-orders/download.svg" alt="" width="18" height="18" />
      Export
    </button>
    <button type="button" class="ov-btn ov-btn-primary" routerLink="/legal/add-litigation">
      <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
      Add Litigation
    </button>
  </div>
</div>

<div class="box mb-5 rounded-2xl overflow-visible bg-white border border-defaultborder shadow-none">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-defaultborder px-5 py-3">
    <div class="flex flex-wrap items-center gap-3">
      <h5 class="m-0 text-[16px] font-semibold leading-[21px] text-defaulttextcolor font-semibold">Litigations List</h5>
    </div>
    <!-- Status Filter Pill Toggles -->
    <div class="ov-seg ov-seg--solid">
      <button type="button" class="ov-seg__btn" [class.is-active]="activeStatusFilter === 'All'" (click)="setStatusFilter('All')">All</button>
      <button type="button" class="ov-seg__btn" [class.is-active]="activeStatusFilter === 'Open'" (click)="setStatusFilter('Open')">Open</button>
      <button type="button" class="ov-seg__btn" [class.is-active]="activeStatusFilter === 'Pending'" (click)="setStatusFilter('Pending')">Pending</button>
      <button type="button" class="ov-seg__btn" [class.is-active]="activeStatusFilter === 'Closed'" (click)="setStatusFilter('Closed')">Closed</button>
    </div>
  </div>

  <!-- Search & Toolbar Actions block -->
  <div class="ov-toolbar !border-b-0 !px-5 !h-auto min-h-10 !pt-5 !pb-5 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
    <div class="ov-search flex-1 max-w-none sm:max-w-[437px]">
      <label class="sr-only" for="litigation-search">Search</label>
      <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
      <input id="litigation-search" type="text" class="ov-input ov-search__input" [(ngModel)]="searchQuery"
        (ngModelChange)="applyFilters()" placeholder="Search by Litigation name...">
    </div>
    
    <div class="ov-toolbar__btns flex gap-2">
      <button type="button" (click)="isDrawerOpen = true" class="ov-btn ov-btn-toolbar" data-tooltip="Filters">
        <img src="assets/images/work-orders/filter.svg" alt="" width="18" height="18" />
        Filter
      </button>
      <div class="relative">
        <button type="button" class="ov-btn ov-btn-toolbar" (click)="showColumnDropdown = !showColumnDropdown" data-tooltip="Visible Columns">
          <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
          Column
        </button>
        <!-- Visible Columns Dropdown Box -->
        <div *ngIf="showColumnDropdown" class="absolute end-0 z-30 mt-1.5 flex min-w-[180px] flex-col gap-2 rounded-lg border border-defaultborder bg-white p-3 shadow-lg dark:bg-bodybg">
          <label class="mb-1 flex cursor-pointer items-center gap-2 border-b border-defaultborder pb-1.5 text-[10px] font-bold uppercase text-defaulttextcolor">
            <input type="checkbox" [checked]="allColumnsSelected" (change)="toggleAllColumns($event)" class="h-3.5 w-3.5 rounded text-primary">
            Select All
          </label>
          <label *ngFor="let col of tableColumns" class="flex cursor-pointer items-center gap-2 text-xs text-textmuted hover:text-defaulttextcolor">
            <input type="checkbox" [checked]="col.visible" (change)="toggleColumn(col.key)" class="h-3.5 w-3.5 rounded text-primary">
            {{ col.label }}
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters Drawer Panel -->
  <app-filter-drawer [(isOpen)]="isDrawerOpen" (apply)="applyFilters()" (clear)="clearFilters()">
    <div class="flex flex-col gap-4">
      <div class="flex flex-col">
        <label class="ov-label">Filter by Legal Firm</label>
        <ng-select [(ngModel)]="filterLegalFirm" [items]="legalFirmsList" [searchable]="true" [clearable]="true"
          placeholder="Select Legal Firm" class="ov-select w-full" appendTo="body"></ng-select>
      </div>

      <div class="flex flex-col">
        <label class="ov-label">Filter by Property</label>
        <ng-select [(ngModel)]="filterProperty" [items]="propertiesList" [searchable]="true" [clearable]="true"
          placeholder="Select Property" class="ov-select w-full" appendTo="body"></ng-select>
      </div>

      <div class="flex flex-col">
        <label class="ov-label">Unit Blocked</label>
        <ng-select [(ngModel)]="filterUnitBlocked" [items]="blockedStatusList" [searchable]="true" [clearable]="true"
          placeholder="Select Status" class="ov-select w-full" appendTo="body"></ng-select>
      </div>

      <div class="flex flex-col">
        <label class="ov-label">Tenant Blocked</label>
        <ng-select [(ngModel)]="filterTenantBlocked" [items]="blockedStatusList" [searchable]="true" [clearable]="true"
          placeholder="Select Status" class="ov-select w-full" appendTo="body"></ng-select>
      </div>
    </div>
  </app-filter-drawer>

  <!-- Shared Table rendering -->
  <div class="px-5 pb-5 pt-0">
    <app-shared-table [columns]="visibleColumns" [data]="filteredData" [loading]="isLoading"
      [hasActions]="false" [showPaginator]="true" [totalRecords]="totalRecords" [pageSize]="pageSize"
      [pageIndex]="pageNo" (pageChange)="onPageChange($event)">
      <ng-template #colTemplate let-row="row" let-col="col">
        <ng-container [ngSwitch]="col.key">

          <!-- clickable link ID cell -->
          <ng-container *ngSwitchCase="'id'">
            <a routerLink="/legal/litigation-details" class="ov-link font-semibold">{{ row.id }}</a>
          </ng-container>

<style>
  .ov-figma-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 0.375rem; /* Matches properties type pill */
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 500;
    line-height: 18px;
    text-align: center;
  }
</style>

          <!-- custom status badge modifier matching Figma -->
          <ng-container *ngSwitchCase="'status'">
            <span *ngIf="row.status === 'Open'" class="ov-figma-badge bg-gray-100 dark:bg-white/10 text-defaulttextcolor border border-defaultborder">
              Open
            </span>
            <span *ngIf="row.status === 'Closed'" class="ov-figma-badge bg-[#C0392B] text-white">
              Closed
            </span>
            <span *ngIf="row.status === 'Pending'" class="ov-figma-badge bg-[#D35400] text-white">
              Pending
            </span>
          </ng-container>

          <!-- clickable properties link -->
          <ng-container *ngSwitchCase="'property'">
            <a href="javascript:void(0)" class="ov-link font-semibold">{{ row.property }}</a>
          </ng-container>

          <!-- clickable units link -->
          <ng-container *ngSwitchCase="'unit'">
            <a href="javascript:void(0)" class="ov-link">{{ row.unit }}</a>
          </ng-container>

          <!-- plain text lease code (no link) -->
          <ng-container *ngSwitchCase="'lease'">
            <span class="text-defaulttextcolor font-medium text-[13px]">{{ row.lease }}</span>
          </ng-container>

          <!-- Yes/No blocked status badge styling -->
          <ng-container *ngSwitchCase="'unitBlocked'">
            <span *ngIf="row.unitBlocked === 'Yes'" class="ov-figma-badge bg-[#1b222c] text-white min-w-[50px]">
              Yes
            </span>
            <span *ngIf="row.unitBlocked === 'No'" class="ov-figma-badge bg-white text-defaulttextcolor border border-defaultborder min-w-[50px]">
              No
            </span>
          </ng-container>

          <ng-container *ngSwitchCase="'tenantBlocked'">
            <span *ngIf="row.tenantBlocked === 'Yes'" class="ov-figma-badge bg-[#1b222c] text-white min-w-[50px]">
              Yes
            </span>
            <span *ngIf="row.tenantBlocked === 'No'" class="ov-figma-badge bg-white text-defaulttextcolor border border-defaultborder min-w-[50px]">
              No
            </span>
          </ng-container>

          <!-- Count columns formatted inside white box containers -->
          <ng-container *ngSwitchCase="'hearingsCount'">
            <span class="ov-figma-badge bg-white text-defaulttextcolor border border-defaultborder min-w-[40px]">
              {{ row.hearingsCount }}
            </span>
          </ng-container>

          <ng-container *ngSwitchCase="'attachmentsCount'">
            <span class="ov-figma-badge bg-white text-defaulttextcolor border border-defaultborder min-w-[40px]">
              {{ row.attachmentsCount }}
            </span>
          </ng-container>

          <ng-container *ngSwitchCase="'notesCount'">
            <span class="ov-figma-badge bg-white text-defaulttextcolor border border-defaultborder min-w-[40px]">
              {{ row.notesCount }}
            </span>
          </ng-container>

        </ng-container>
      </ng-template>
    </app-shared-table>
  </div>
</div>
