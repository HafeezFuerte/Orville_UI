<!-- Broadcast List Page -->
<div class="block justify-between page-header md:flex mb-6 items-center">
  <div class="flex items-center gap-3">
    <div>
      <h3 class="!text-defaulttextcolor dark:!text-defaulttextcolor/70 text-[1.5rem] font-semibold mb-1">
        Broadcasts
      </h3>
      <ol class="flex items-center whitespace-nowrap text-[0.75rem] text-gray-500">
        <li class="hover:text-primary cursor-pointer">Broadcasts</li>
        <li class="px-2 text-gray-400">/</li>
        <li class="font-semibold text-defaulttextcolor dark:text-white/70">List</li>
      </ol>
    </div>
  </div>
  <div class="flex gap-1.5 items-center mt-2 md:mt-0">
    <button type="button"
      class="w-8 h-8 rounded-md bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white hover:border-primary transition-all duration-200 shadow-sm"
      [attr.data-tooltip]="'Report'">
      <i class="ri-bar-chart-2-fill text-sm"></i>
    </button>
    <button type="button" (click)="navigateToCreate()"
      class="ti-btn bg-primary hover:bg-primary-hover text-white text-xs font-bold w-8 h-8 !px-0 rounded-md flex items-center justify-center shadow-sm"
      [attr.data-tooltip]="'Add Broadcasts'">
      <i class="ri-add-line text-sm"></i>
    </button>
  </div>
</div>

<!-- Main card -->
<div class="box bg-white rounded-xl shadow-sm border border-gray-100 !mb-2">
  <!-- Toolbar -->
  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 flex-wrap gap-3">
    <div class="flex items-center gap-4 flex-wrap">
      <h6 class="box-title font-semibold text-gray-800 text-sm m-0">Broadcasts List</h6>
      <div class="flex items-center gap-2">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          placeholder="Search..."
          class="form-control text-xs w-64 bg-gray-50 border border-gray-200 rounded-md py-1.5 px-3 focus:bg-white focus:border-primary transition-all"
        />
        <button type="button" (click)="onSearch()"
          class="w-8 h-8 rounded-md bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white hover:border-primary transition-all duration-200 shadow-sm"
          [attr.data-tooltip]="'Search'">
          <i class="ri-search-line text-sm"></i>
        </button>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- Filter Button -->
      <button type="button" (click)="toggleDrawer(true)"
        class="ov-btn ov-btn-toolbar"
        [attr.data-tooltip]="'web.dashboard.lblFilters' | translate">
        <i class="ri-equalizer-line text-[18px]"></i>
        Filter
      </button>

      <!-- Column Button with dropdown overlay -->
      <div class="relative">
        <button type="button" (click)="showColumnDropdown = !showColumnDropdown"
          class="ov-btn ov-btn-toolbar"
          [attr.data-tooltip]="'Columns'">
          <i class="ri-layout-column-line text-[18px]"></i>
          Column
        </button>

        <!-- Column toggling checklist dropdown overlay -->
        <div *ngIf="showColumnDropdown"
          class="absolute right-0 mt-1.5 z-30 bg-white border border-gray-200 rounded-lg shadow-lg p-3 min-w-[180px] flex flex-col gap-2 animate-fade-in">
          <label
            class="flex items-center gap-2 cursor-pointer font-bold text-gray-700 text-[10px] border-b pb-1.5 mb-1">
            <input type="checkbox" [checked]="allColumnsSelected" (change)="toggleAllColumns($event)"
              class="form-checkbox h-3.5 w-3.5 text-primary rounded">
            Select All
          </label>
          <div class="flex flex-col gap-1.5 max-h-48 overflow-y-auto">
            <label *ngFor="let col of tableColumns"
              class="flex items-center gap-2 cursor-pointer text-gray-600 text-xs hover:text-gray-900 transition-colors">
              <input type="checkbox" [checked]="col.visible" (change)="toggleColumn(col)"
                class="form-checkbox h-3.5 w-3.5 text-primary rounded">
              {{ col.label }}
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
 
  <!-- Table -->
  <div class="p-6">
    <app-shared-table 
      [columns]="visibleColumns" 
      [data]="broadcastData" 
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageNo"
      (pageChange)="onSharedTablePageChange($event)">
      
      <ng-template #colTemplate let-row="row"  let-col="col">
        <ng-container [ngSwitch]="col.key">
          <!-- ID -->
          <ng-container *ngSwitchCase="'id'">
            <span [routerLink]="['/broadcasts', row.code]" class="text-primary font-semibold hover:underline cursor-pointer transition-all">{{ row.code }}</span>
          </ng-container>

          <!-- Preview -->
          <ng-container *ngSwitchCase="'preview'">
            <button [routerLink]="['/broadcasts', row.code]" class="px-2.5 py-1 text-[10px] font-semibold rounded bg-primary/10 text-primary hover:bg-primary/20 transition-all border-0">
              Quick View
            </button>
          </ng-container>

          <!-- Status -->
          <ng-container *ngSwitchCase="'status'">
            <span *ngIf="row.status === 108" class="px-2 py-0.5 rounded text-[10px] font-bold bg-success/10 text-success">{{getArabicLookupName(row, 'status_text')}}</span>
            <span *ngIf="row.status === 110" class="px-2 py-0.5 rounded text-[10px] font-bold bg-warning/10 text-warning">{{getArabicLookupName(row, 'status_text')}}</span>
            <span *ngIf="row.status === 109" class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary/10 text-primary">{{getArabicLookupName(row, 'status_text')}}</span>
          </ng-container>

          <!-- Scheduled -->
          <ng-container *ngSwitchCase="'scheduled'">
            <span *ngIf="row.scheduled" class="px-2 py-0.5 rounded text-[10px] font-bold bg-info/10 text-info">Yes</span>
            <span *ngIf="!row.scheduled" class="text-gray-400">No</span>
          </ng-container>

          <!-- Action -->
          <ng-container *ngSwitchCase="'action'">
            <div class="flex items-center gap-1.5">
              <button (click)="navigateToDetail(row.code)" class="w-7 h-7 rounded flex items-center justify-center bg-primary/10 text-primary hover:bg-primary/20 transition-all border-0" title="View">
                <i class="ri-eye-line text-sm"></i>
              </button>
              <button (click)="navigateToEdit(row.code)" class="w-7 h-7 rounded flex items-center justify-center bg-warning/10 text-warning hover:bg-warning/20 transition-all border-0" title="Edit">
                <i class="ri-edit-line text-sm"></i>
              </button>
              <button class="w-7 h-7 rounded flex items-center justify-center bg-danger/10 text-danger hover:bg-danger/20 transition-all border-0" title="Delete">
                <i class="ri-delete-bin-line text-sm"></i>
              </button>
            </div>
          </ng-container>
        </ng-container>
      </ng-template>
    </app-shared-table>
  </div>
</div>

<app-filter-drawer [isOpen]="showFilterDrawer" (closeDrawer)="toggleDrawer(false)"></app-filter-drawer>
