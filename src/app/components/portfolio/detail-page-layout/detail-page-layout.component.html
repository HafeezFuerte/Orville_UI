<div class="ov-detail-layout">
    <!-- Left Panel -->
    <div class="ov-detail-layout__left">
        <ng-container *ngTemplateOutlet="leftPanel"></ng-container>
    </div>
    <!-- Right Panel -->
    <div class="ov-detail-layout__right">
        <div class="box ov-card overflow-visible shadow-none">
            <div class="ov-detail-tabs">
                <button
                    type="button"
                    *ngFor="let tab of tabs"
                    (click)="changeTab(tab)"
                    class="ov-detail-tabs__btn"
                    [class.is-active]="activeTab == tab.key">
                    {{(tab?.label ?? '') | translate}}
                </button>
            </div>

            <div class="p-5">
                <!-- Overview / generic content -->
                <ng-container *ngIf="selectedTab?.layout === 'content' && (isTabActive('overview') || checkCommonTab())">
                    <ng-container *ngTemplateOutlet="overview"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && (isTabActive('units') || isTabActive('rooms'))">
                    <ng-container *ngTemplateOutlet="units"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('notes')">
                    <ng-container *ngTemplateOutlet="notes"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && (isTabActive('attachments') || isTabActive('edocuments'))">
                    <ng-container *ngTemplateOutlet="attachments"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('commonarea')">
                    <ng-container *ngTemplateOutlet="commonarea"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('parkings')">
                    <ng-container *ngTemplateOutlet="parkings"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('financials') && financials">
                    <ng-container *ngTemplateOutlet="financials"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('inventory') && inventory">
                    <ng-container *ngTemplateOutlet="inventory"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('workorders') && workorders">
                    <ng-container *ngTemplateOutlet="workorders"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('legal') && legal">
                    <ng-container *ngTemplateOutlet="legal"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && isTabActive('inspections') && inspections">
                    <ng-container *ngTemplateOutlet="inspections"></ng-container>
                </ng-container>

                <ng-container *ngIf="selectedTab?.layout === 'content' && (isTabActive('broadcasts') || isTabActive('notices')) && broadcasts">
                    <ng-container *ngTemplateOutlet="broadcasts"></ng-container>
                </ng-container>

                <!-- Table Layout -->
                <ng-container *ngIf="selectedTab?.layout === 'table'">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
                        <div>
                            <h4 class="ov-card-title m-0">{{ selectedTab?.label! | translate}}</h4>
                        </div>
                        <ng-container *ngIf="selectedTab?.redirect_addurl == null">
                            <button type="button" (click)="openModal()"
                                class="ov-btn ov-btn-primary"
                                [attr.data-tooltip]="'Add ' + selectedTab?.addButtonText">
                                <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
                                Add {{ selectedTab?.addButtonText }}
                            </button>
                        </ng-container>
                        <ng-container *ngIf="selectedTab?.redirect_addurl != null">
                            <a [routerLink]="[selectedTab?.redirect_addurl]"
                                class="ov-btn ov-btn-primary"
                                [attr.data-tooltip]="'Add ' + selectedTab?.addButtonText">
                                <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
                                Add {{ selectedTab?.addButtonText }}
                            </a>
                        </ng-container>
                    </div>

                    <div class="ov-toolbar !border-b-0 !px-0 !h-auto min-h-10 py-0 mb-4 flex-col sm:flex-row items-stretch sm:items-center">
                        <div class="ov-search flex-1 max-w-none sm:max-w-[437px]">
                            <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
                            <input [(ngModel)]="searchQuery"
                                (keyup.enter)="search_with_keyword()"
                                type="text"
                                class="ov-input ov-search__input"
                                placeholder="Search">
                        </div>
                        <div class="ov-toolbar__btns">
                            <button type="button" (click)="toggleDrawer(true)" class="ov-btn ov-btn-toolbar"
                                [attr.data-tooltip]="'web.common.lblFilter' | translate">
                                <img src="assets/images/work-orders/filter.svg" alt="" width="18" height="18" />
                                Filter
                            </button>
                            <div class="relative">
                                <button type="button" class="ov-btn ov-btn-toolbar" (click)="toggleColumnDropdown()"
                                    [attr.data-tooltip]="'web.common.lblColumns' | translate">
                                    <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
                                    Column
                                </button>
                                <div *ngIf="isColumnDropdownOpen"
                                    class="absolute end-0 z-30 mt-1.5 flex min-w-[180px] flex-col gap-2 rounded-lg border border-defaultborder bg-white p-3 shadow-lg dark:bg-bodybg">
                                    <label class="mb-1 flex cursor-pointer items-center gap-2 border-b border-defaultborder pb-1.5 text-[10px] font-bold uppercase text-defaulttextcolor">
                                        <input type="checkbox" class="h-3.5 w-3.5 rounded text-primary"
                                            [checked]="allColumnsVisible" (change)="toggleAllColumns($event)">
                                        Select All
                                    </label>
                                    <label *ngFor="let col of selectedTab?.columns || []"
                                        class="flex cursor-pointer items-center gap-2 text-xs text-textmuted hover:text-defaulttextcolor">
                                        <input type="checkbox" class="h-3.5 w-3.5 rounded text-primary"
                                            [checked]="col.visible !== false" (change)="toggleColumn(col)">
                                        {{ col.label | translate }}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <app-shared-table
                        [columns]="visibleColumns"
                        [data]="selectedTab?.data || []"
                        [loading]="selectedTab?.loading || false"
                        [totalRecords]="selectedTab?.totalRecords || 0"
                        [pageSize]="selectedTab?.pageSize || 50"
                        [pageIndex]="selectedTab?.pageIndex || 0"
                        [hasActions]="selectedTab?.hasActions || false"
                        (notify_edit_action)="handleChildNotification($event)">
                    </app-shared-table>
                </ng-container>

                <!-- Content + Table -->
                <ng-container *ngIf="selectedTab?.layout === 'content-table'">
                    <ng-container *ngTemplateOutlet="overview"></ng-container>
                    <div class="mt-6">
                        <app-shared-table
                            [columns]="visibleColumns"
                            [data]="selectedTab?.data || []"
                            [loading]="selectedTab?.loading || false"
                            [totalRecords]="selectedTab?.totalRecords || 0"
                            [pageSize]="selectedTab?.pageSize || 50"
                            [pageIndex]="selectedTab?.pageIndex || 0"
                            [hasActions]="selectedTab?.hasActions || false">
                        </app-shared-table>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</div>

<app-reusable-modal
    *ngIf="showModal"
    [title]="'Add ' + (selectedTab?.addButtonText || '')"
    subtitle="Enter details"
    (save)="onSave()"
    (close)="closeModal()">
    <app-common-area-popup
        *ngIf="selectedTab?.popupType === 'common-area'"
        [form]="selectedTab!.form!">
    </app-common-area-popup>
    <app-attachment-popup
        *ngIf="selectedTab?.popupType === 'attachment'"
        [form]="selectedTab!.form!"
        (fileSelected)="attachmentFileSelected.emit($event)">
    </app-attachment-popup>
    <app-notes-popup
        *ngIf="selectedTab?.popupType === 'notes'"
        [form]="selectedTab!.form!">
    </app-notes-popup>
</app-reusable-modal>

<app-confirm-popup *ngIf="showConfirmModal"></app-confirm-popup>

<app-filter-drawer
    [(isOpen)]="isDrawerOpen"
    (apply)="applyFilters()"
    (clear)="clearFilters()">

    <div class="flex flex-col gap-4">
        <div class="flex flex-col">
            <label class="ov-label">Filter by Tags</label>
            <input type="text" class="ov-input" [(ngModel)]="filterTags" (keyup.enter)="applyFilters()">
        </div>
        <div class="flex flex-col">
            <label class="ov-label">Filter by Area (sqft)</label>
            <input type="text" class="ov-input" [(ngModel)]="filterArea" (keyup.enter)="applyFilters()">
        </div>
        <div class="flex flex-col">
            <label class="ov-label">Filter by ID</label>
            <input type="text" class="ov-input" [(ngModel)]="filterId" (keyup.enter)="applyFilters()">
        </div>
        <div class="flex flex-col">
            <label class="ov-label">Filter by Reference No</label>
            <input type="text" class="ov-input" [(ngModel)]="filterRefNo" (keyup.enter)="applyFilters()">
        </div>
        <div class="flex flex-col">
            <label class="ov-label">Off Plan Status</label>
            <select class="ov-input" [(ngModel)]="filterOffPlanStatus" (change)="applyFilters()">
                <option value="">Select Status</option>
            </select>
        </div>
        <div class="flex flex-col">
            <label class="ov-label">Filter by Landlord</label>
            <input type="text" class="ov-input" [(ngModel)]="filterLandlord" (keyup.enter)="applyFilters()">
        </div>
        <div class="flex flex-col">
            <label class="ov-label">Internal Status</label>
            <select class="ov-input" [(ngModel)]="filterInternalStatus" (change)="applyFilters()">
                <option value="">Select Status</option>
            </select>
        </div>
    </div>
</app-filter-drawer>
