<div class="grid grid-cols-12 gap-6 mt-4">
    <!-- Left Panel -->
    <div class="col-span-12 lg:col-span-4">
        <ng-container
            *ngTemplateOutlet="leftPanel">
        </ng-container>
    </div>
    <!-- Right Panel -->
    <div class="col-span-12 lg:col-span-8">
        <div class="box ov-card overflow-hidden shadow-none">
            <!-- Tabs -->
            <div class="border-b border-defaultborder bg-white p-2 overflow-x-auto whitespace-nowrap flex gap-1 dark:bg-bodybg">
                <button
                    type="button"
                    *ngFor="let tab of tabs"
                    (click)="changeTab(tab)"
                    class="px-4 py-2 text-[14px] rounded-md border-0 bg-transparent transition-all"
                    [class]="activeTab==tab.key
                    ?
                    'text-primary font-semibold border-b-2 border-primary rounded-none'
                    :
                    'text-textmuted font-medium hover:text-defaulttextcolor'">
                    {{(tab?.label ?? '') | translate}}
                </button>
            </div>

            <!-- Body -->
          <div class="p-6">
    <!-- Content Layout -->
    <ng-container *ngIf="selectedTab?.layout === 'content' 
    && checkCommonTab()">
        <ng-container
            *ngTemplateOutlet="overview">
        </ng-container>
    </ng-container>
    <ng-container *ngIf="selectedTab?.layout === 'content' && (selectedTab?.key=='units'|| selectedTab?.key=='rooms' )">
      <ng-container
          *ngTemplateOutlet="units">
      </ng-container>
  </ng-container>
  <ng-container *ngIf="selectedTab?.layout === 'content' && ( selectedTab?.key=='notes')">
    <ng-container
        *ngTemplateOutlet="notes">
    </ng-container>
</ng-container>
<ng-container *ngIf="selectedTab?.layout === 'content' && ( selectedTab?.key=='attachments')">
  <ng-container
      *ngTemplateOutlet="attachments">
  </ng-container>
</ng-container>
<ng-container *ngIf="selectedTab?.layout === 'content' && ( selectedTab?.key=='commonarea')">
  <ng-container
      *ngTemplateOutlet="commonarea">
  </ng-container>
</ng-container>
<ng-container *ngIf="selectedTab?.layout === 'content' && ( selectedTab?.key=='parkings')">
  <ng-container
      *ngTemplateOutlet="parkings">
  </ng-container>
</ng-container>

    <!-- Table Layout -->
    <ng-container *ngIf="selectedTab?.layout === 'table'">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-gray-100 pb-3">
          <div>
            <h4 class="text-xs font-bold text-gray-800 m-0">{{ selectedTab?.label! | translate}}</h4>
          </div>
        <ng-container *ngIf="selectedTab?.redirect_addurl == null">
          <button type="button" (click)="openModal()"
            class="w-8 h-8 rounded-md bg-primary text-white flex items-center justify-center hover:bg-primary-hover transition-all duration-200 shadow-sm"
            [attr.data-tooltip]="'Add ' + selectedTab?.addButtonText">
            <i class="ri-add-line text-[1rem]"></i>
          </button>
        </ng-container>
        <ng-container *ngIf="selectedTab?.redirect_addurl != null">
          <a [routerLink]="[selectedTab?.redirect_addurl]"
            class="w-8 h-8 rounded-md bg-primary text-white flex items-center justify-center hover:bg-primary-hover transition-all duration-200 shadow-sm cursor-pointer"
            [attr.data-tooltip]="'Add ' + selectedTab?.addButtonText">
            <i class="ri-add-line text-[1rem]"></i>
          </a>
        </ng-container>
        </div>
<!-- Toolbar -->
<div
  *ngIf="selectedTab?.layout === 'table' || selectedTab?.layout === 'content-table'"
  class="flex flex-col md:flex-row justify-between items-center gap-3 mb-4">
  <!-- Search -->
  <div class="w-full md:w-96">
    <div class="input-group">
      <input [(ngModel)]="searchQuery"
      (keyup.enter)="search_with_keyword()"
        type="text"
        class="form-control"
        placeholder="Search">
      <button
        class="input-group-text bg-primary/10 text-primary" (click)="search_with_keyword()" >
        <i class="ri-search-line"></i>
      </button>
    </div>
    
  </div>

  <!-- Right Buttons -->
  <div class="flex gap-2">
    <button type="button" (click)="toggleDrawer(true)"
        class="w-8 h-8 rounded-md bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white hover:border-primary transition-all duration-200 shadow-sm"
        [attr.data-tooltip]="'web.common.lblFilter' | translate">
        <i class="ri-filter-3-line text-[0.9rem] align-middle"></i>
    </button>
    <div class="relative inline-block">
        <button type="button" class="w-8 h-8 rounded-md bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white hover:border-primary transition-all duration-200 shadow-sm" (click)="toggleColumnDropdown()" [attr.data-tooltip]="'web.common.lblColumns' | translate">
            <i class="ri-layout-column-line text-[0.9rem] align-middle"></i>
        </button>
        <!-- Dropdown -->
        <div *ngIf="isColumnDropdownOpen" class="absolute right-0 mt-1 w-56 bg-white rounded-md shadow-lg z-50 border border-gray-100 p-2 text-start">
            <div class="flex justify-between items-center pb-2 border-b border-gray-100 mb-2">
                <span class="font-bold text-xs text-gray-700">Column</span>
                <i class="ri-close-line cursor-pointer text-gray-400 hover:text-gray-700" (click)="isColumnDropdownOpen = false"></i>
            </div>
            <div class="max-h-60 overflow-y-auto">
                <label class="flex items-center gap-2 p-1.5 hover:bg-gray-50 cursor-pointer rounded m-0">
                    <input type="checkbox" class="form-checkbox h-3.5 w-3.5 text-primary rounded border-gray-300" 
                           [checked]="allColumnsVisible" (change)="toggleAllColumns($event)">
                    <span class="text-xs text-gray-700 font-semibold">Select All</span>
                </label>
                <label *ngFor="let col of selectedTab?.columns || []" class="flex items-center gap-2 p-1.5 hover:bg-gray-50 cursor-pointer rounded m-0">
                    <input type="checkbox" class="form-checkbox h-3.5 w-3.5 text-primary rounded border-gray-300" 
                           [checked]="col.visible !== false" (change)="toggleColumn(col)">
                    <span class="text-xs text-gray-700">{{ col.label | translate }}</span>
                </label>
            </div>
        </div>
    </div>
  </div>
</div>
        <app-shared-table
            [columns]="visibleColumns"
            [data]="selectedTab?.data || []"
            [loading]="selectedTab?.loading || false"
            [totalRecords]="selectedTab?.totalRecords || 0"
            [pageSize]="selectedTab?.pageSize || 50"
            [pageIndex]="selectedTab?.pageIndex || 0"
            [hasActions]="selectedTab?.hasActions || false"
            (notify_edit_action)="handleChildNotification($event)"
            >

        </app-shared-table>
    </ng-container>

    <!-- Content + Table -->
    <ng-container *ngIf="selectedTab?.layout === 'content-table'">
        <ng-container
            *ngTemplateOutlet="overview">
        </ng-container>
        <div class="mt-6">
            <app-shared-table
                [columns]="visibleColumns"
                [data]="selectedTab?.data || []"
                [loading]="selectedTab?.loading || false"
                [totalRecords]="selectedTab?.totalRecords || 0"
                [pageSize]="selectedTab?.pageSize || 50"
                [pageIndex]="selectedTab?.pageIndex || 0"
                [hasActions]="selectedTab?.hasActions || false">

            </app-shared-table>
        </div>
    </ng-container>
</div>
        </div>
    </div>
</div>
<app-reusable-modal
    *ngIf="showModal"
    [title]="'Add ' + (selectedTab?.addButtonText || '')"
    subtitle="Enter details"
    (save)="onSave()"
    (close)="closeModal()">
    <app-common-area-popup
        *ngIf="selectedTab?.popupType === 'common-area'"
        [form]="selectedTab!.form!">
    </app-common-area-popup>
    <app-attachment-popup
        *ngIf="selectedTab?.popupType === 'attachment'"
        [form]="selectedTab!.form!"
        (fileSelected)="attachmentFileSelected.emit($event)">
    </app-attachment-popup>
    <app-notes-popup
     *ngIf="selectedTab?.popupType === 'notes'"
        [form]="selectedTab!.form!">
    </app-notes-popup>
</app-reusable-modal>
<app-confirm-popup
*ngIf="showConfirmModal" >
</app-confirm-popup>

<!-- 🚪 SLIDING FILTER DRAWER -->
<app-filter-drawer 
  [(isOpen)]="isDrawerOpen" 
  (apply)="applyFilters()" 
  (clear)="clearFilters()">
  
  <div class="flex flex-col gap-4 text-[11px]">
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by Tags</label>
      <input type="text" class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200" [(ngModel)]="filterTags" (keyup.enter)="applyFilters()">
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by Area (sqft)</label>
      <input type="text" class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200" [(ngModel)]="filterArea" (keyup.enter)="applyFilters()">
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by ID</label>
      <input type="text" class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200" [(ngModel)]="filterId" (keyup.enter)="applyFilters()">
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by Reference No</label>
      <input type="text" class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200" [(ngModel)]="filterRefNo" (keyup.enter)="applyFilters()">
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Off Plan Status</label>
      <select class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200" [(ngModel)]="filterOffPlanStatus" (change)="applyFilters()">
        <option value="">Select Status</option>
      </select>
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by Landlord</label>
      <input type="text" class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200" [(ngModel)]="filterLandlord" (keyup.enter)="applyFilters()">
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Internal Status</label>
      <select class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200" [(ngModel)]="filterInternalStatus" (change)="applyFilters()">
        <option value="">Select Status</option>
      </select>
    </div>
  </div>
  
</app-filter-drawer>
