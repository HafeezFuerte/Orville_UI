<form class="ov-add-form" (ngSubmit)="save()">
  <div class="ov-add-header page-header">
    <div class="ov-add-header__start">
      <button type="button" class="ov-back" (click)="cancel()" title="Back to Guides">
        <img src="assets/images/common/arrow-narrow-left.svg" alt="" width="24" height="24" />
      </button>
      <div>
        <h3 class="ov-page-title">New Guide</h3>
        <p class="ov-page-sub">Community / Guide / <span class="ov-page-sub__current">New Guide</span></p>
      </div>
    </div>
    <div class="ov-add-header__actions">
      <button type="button" class="ov-btn guide-add-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="ov-btn ov-btn-primary">Create Guide</button>
    </div>
  </div>

  <div class="ov-add-body guide-add-body">
    <div class="guide-add-layout">
      <section class="box ov-card guide-add-main !mb-0">
        <div class="ov-card__head">
          <h6 class="ov-card-title">Guide Information</h6>
        </div>
        <div class="ov-card__body">
          <div class="ov-fields">
            <div class="ov-fields__full">
              <label class="ov-label">Name <span class="text-danger">*</span></label>
              <input type="text" class="ov-input" name="name" [(ngModel)]="form.name"
                placeholder="Enter rule or guide name">
            </div>
            <div class="ov-fields__full">
              <label class="ov-label">Select Property <span class="text-danger">*</span></label>
              <ng-select [(ngModel)]="form.property" name="property" [items]="properties"
                [clearable]="true" placeholder="Select property" class="ov-select ng-select-sm w-full"
                appendTo="body"></ng-select>
            </div>
            <div class="ov-fields__full">
              <label class="ov-label">Description</label>
              <div class="guide-editor">
                <div class="guide-editor__toolbar" aria-hidden="true">
                  <div class="guide-editor__group">
                    <span class="guide-editor__chip">H</span>
                    <button type="button" class="guide-editor__btn guide-editor__btn--text" tabindex="-1">Text</button>
                  </div>
                  <span class="guide-editor__sep"></span>
                  <div class="guide-editor__group">
                    <button type="button" class="guide-editor__btn" tabindex="-1"><strong>B</strong></button>
                    <button type="button" class="guide-editor__btn" tabindex="-1"><em>I</em></button>
                    <button type="button" class="guide-editor__btn" tabindex="-1"><u>U</u></button>
                    <button type="button" class="guide-editor__btn" tabindex="-1"><s>S</s></button>
                  </div>
                  <span class="guide-editor__sep"></span>
                  <div class="guide-editor__group">
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Align left">
                      <i class="ri-align-left"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Align right">
                      <i class="ri-align-right"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Align center">
                      <i class="ri-align-center"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Justify">
                      <i class="ri-align-justify"></i>
                    </button>
                  </div>
                  <span class="guide-editor__sep"></span>
                  <div class="guide-editor__group">
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Bullet list">
                      <i class="ri-list-unordered"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Numbered list">
                      <i class="ri-list-ordered"></i>
                    </button>
                  </div>
                  <span class="guide-editor__sep"></span>
                  <div class="guide-editor__group">
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Link">
                      <i class="ri-link"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Image">
                      <i class="ri-image-line"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Quote">
                      <i class="ri-double-quotes-l"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Code">
                      <i class="ri-code-s-slash-line"></i>
                    </button>
                  </div>
                  <span class="guide-editor__sep"></span>
                  <div class="guide-editor__group">
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Undo">
                      <i class="ri-arrow-go-back-line"></i>
                    </button>
                    <button type="button" class="guide-editor__btn" tabindex="-1" aria-label="Redo">
                      <i class="ri-arrow-go-forward-line"></i>
                    </button>
                  </div>
                </div>
                <textarea class="guide-editor__input" name="description" [(ngModel)]="form.description"
                  placeholder="Write the note content here..." rows="4"></textarea>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="box ov-card guide-add-files !mb-0">
        <div class="ov-card__head">
          <h6 class="ov-card-title">Files</h6>
        </div>
        <div class="ov-card__body">
          <div class="guide-upload">
            <img class="guide-upload__icon" src="assets/images/rules-guides/upload.svg" alt="" width="35" height="35" />
            <p class="guide-upload__title m-0">Add files</p>
            <p class="guide-upload__sub m-0">or drop files to upload</p>
            <button type="button" class="ov-btn ov-btn-primary guide-upload__btn">
              <img src="assets/images/rules-guides/upload.svg" alt="" width="18" height="18" class="guide-upload__btn-ico" />
              Upload File
            </button>
          </div>
        </div>
      </section>
    </div>

    <div class="ov-add-footer guide-add-footer">
      <button type="button" class="ov-btn guide-add-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="ov-btn ov-btn-primary">Create Guide</button>
    </div>
  </div>
</form>
