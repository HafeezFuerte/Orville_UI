<div class="pi-page font-hanken">
  <div class="page-header !py-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-3 min-w-0">
      <button type="button" class="ov-back" (click)="goBack()" [title]="'web.propertyListings.inquiries.back' | translate" [attr.aria-label]="'web.propertyListings.inquiries.back' | translate">
        <img src="assets/images/common/arrow-narrow-left.svg" alt="" width="24" height="24" />
      </button>
      <h3 class="ov-page-title m-0">{{ 'web.propertyListings.inquiries.title' | translate }}</h3>
    </div>

    <div class="ov-toolbar__btns shrink-0">
      <button
        type="button"
        class="ov-btn ov-btn-toolbar"
        (click)="isDrawerOpen = true"
        [attr.data-tooltip]="'web.propertyListings.inquiries.filter' | translate">
        <img src="assets/images/work-orders/filter.svg" alt="" width="18" height="18" />
        {{ 'web.propertyListings.inquiries.filter' | translate }}
      </button>
      <div class="relative" (click)="$event.stopPropagation()">
        <button
          type="button"
          class="ov-btn ov-btn-toolbar"
          (click)="toggleColumnDropdown($event)"
          [attr.data-tooltip]="'web.propertyListings.inquiries.column' | translate">
          <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
          {{ 'web.propertyListings.inquiries.column' | translate }}
        </button>
        <app-column-menu
          *ngIf="showColumnDropdown"
          [columns]="tableColumns"
          (toggle)="toggleColumn($event)"
          (toggleAll)="toggleAllColumns($event)"
          (closed)="showColumnDropdown = false">
        </app-column-menu>
      </div>
    </div>
  </div>

  <div class="box mb-5 overflow-visible rounded-2xl border border-defaultborder bg-white shadow-none dark:bg-bodybg">
    <div class="overflow-x-auto px-5 pb-5 pt-5">
      <app-shared-table  [columns]="visibleColumns" [data]="allRows" [loading]="false"
      [totalRecords]="totalRecords" [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize" [pageIndex]="pageNo" (pageChange)="onSharedTablePageChange($event)" [hasActions]="false" [showPaginator]="false">

      <ng-template #colTemplate let-row="row" let-col="col">
        <ng-container *ngIf="col.key === 'code'">
          <a class="ov-link">{{row.code}}</a>
        </ng-container>

        <ng-container *ngIf="col.key === 'name'">
          <div class="flex flex-col">
            <span class="font-semibold text-defaulttextcolor">{{row.name}}</span>
            <span class="flex items-center gap-1 text-[12px] text-textmuted font-normal">
              <img src="assets/images/work-orders/map-pin.svg" alt="" width="14" height="14" />
              {{row.address_1}}
            </span>
          </div>
        </ng-container>

       
        <ng-container *ngIf="col.key === 'internal Status'">
          <span class="text-[14px] font-medium text-defaulttextcolor">{{row['internal Status'] || 'All'}}</span>
        </ng-container>

        <ng-container *ngIf="col.key === 'tags'">
          <span class="text-[14px] font-medium text-defaulttextcolor">{{row.tags || 'Tags'}}</span>
        </ng-container>

        <ng-container *ngIf="col.key === 'total_leases'">
          <span>{{row.total_leases || 0}}</span>
        </ng-container>

        <ng-container *ngIf="col.key === 'contracts'">
          <span>{{row.contracts || 0}}</span>
        </ng-container>
 

        <!-- <ng-container *ngIf="col.key === 'action'">
          <div class="relative inline-flex" (click)="$event.stopPropagation()">
            <button type="button" class="ov-icon-btn ov-icon-btn--bare"
              (click)="toggleRowAction(row.code, $event)">
              <img src="assets/images/common/dots-vertical.svg" alt="" width="20" height="20" class="ov-action-ico" />
            </button>
            <div *ngIf="openActionCode === row.code" class="absolute end-0 z-20 mt-1 min-w-[132px] rounded-lg border border-defaultborder bg-white py-1 shadow-lg dark:bg-bodybg">
              <button type="button" class="block w-full border-0 bg-transparent px-3 py-2 text-start text-[14px] text-defaulttextcolor hover:bg-light"
                (click)="viewProperty(row.code)">{{ 'web.common.lblView' | translate }}</button>
              <button type="button" class="block w-full border-0 bg-transparent px-3 py-2 text-start text-[14px] text-defaulttextcolor hover:bg-light"
                (click)="editProperty(row.code)">{{ 'web.common.lblEdit' | translate }}</button>
              <button type="button" class="block w-full border-0 bg-transparent px-3 py-2 text-start text-[14px] text-danger hover:bg-light"
                (click)="handleChildNotification({ action_name: 'delete', code: row.code }); openActionCode = null">{{ 'web.common.lblDelete' | translate }}</button>
            </div>
          </div>
        </ng-container> -->
      </ng-template>

    </app-shared-table>
    </div>
  </div>
</div>

<app-filter-drawer [(isOpen)]="isDrawerOpen" (apply)="applyFilters()" (clear)="clearFilters()">
  <div class="flex flex-col gap-4">
    <div>
      <label class="ov-label">{{ 'web.propertyListings.inquiries.drawerInquiryType' | translate }}</label>
      <select class="ov-input" [(ngModel)]="filterInquiryType">
        <option value="">{{ 'web.propertyListings.inquiries.drawerAll' | translate }}</option>
        <option value="For Rent">{{ 'web.propertyListings.inquiries.typeForRent' | translate }}</option>
        <option value="For Sale">{{ 'web.propertyListings.inquiries.typeForSale' | translate }}</option>
        <option value="Viewing">{{ 'web.propertyListings.inquiries.typeViewing' | translate }}</option>
        <option value="General">{{ 'web.propertyListings.inquiries.typeGeneral' | translate }}</option>
      </select>
    </div>
    <div>
      <label class="ov-label">{{ 'web.propertyListings.inquiries.drawerUnit' | translate }}</label>
      <input
        type="text"
        class="ov-input"
        [(ngModel)]="filterUnit"
        (keyup.enter)="applyFilters()"
        [placeholder]="'web.propertyListings.inquiries.phUnit' | translate" />
    </div>
  </div>
</app-filter-drawer>
