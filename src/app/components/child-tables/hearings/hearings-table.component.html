<div>
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
    <h5 class="text-[16px] font-bold text-defaulttextcolor m-0">Hearing list</h5>
    <button (click)="openAddModal()" type="button" class="ov-btn ov-btn-primary d-inline-flex align-items-center gap-1.5">
      <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" /> Add Hearing
    </button>
  </div>

  <div class="ov-toolbar !border-b-0 !px-0 !h-auto min-h-10 py-0 mb-4 flex justify-between items-center">
    <div class="ov-search flex-1 max-w-[360px]">
      <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
      <input type="text" class="ov-input ov-search__input" placeholder="Search">
    </div>
    <div class="relative">
      <button type="button" (click)="toggleColumnDropdown()" class="ov-btn ov-btn-toolbar" [attr.data-tooltip]="'web.common.lblColumns' | translate">
        <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" /> {{ 'web.common.lblColumns' | translate }}
      </button>
      <div *ngIf="isColumnDropdownOpen"
        class="absolute end-0 z-30 mt-1.5 flex min-w-[180px] flex-col gap-2 rounded-lg border border-defaultborder bg-white p-3 shadow-lg dark:bg-bodybg">
        <label class="mb-1 flex cursor-pointer items-center gap-2 border-b border-defaultborder pb-1.5 text-[10px] font-bold uppercase text-defaulttextcolor">
          <input type="checkbox" class="h-3.5 w-3.5 rounded text-primary"
            [checked]="allColumnsVisible" (change)="toggleAllColumns($event)">
          Select All
        </label>
        <label *ngFor="let col of columns"
          class="flex cursor-pointer items-center gap-2 text-xs text-textmuted hover:text-defaulttextcolor">
          <input type="checkbox" class="h-3.5 w-3.5 rounded text-primary"
            [checked]="col.visible !== false" (change)="toggleColumn(col)">
          {{ col.label }}
        </label>
      </div>
    </div>
  </div>

  <!-- Shared Table rendering -->
  <app-shared-table [columns]="visibleColumns" [data]="selectedTab?.data || []" [loading]="selectedTab?.loading || false" [hasActions]="false" [showPaginator]="true">
    <ng-template #colTemplate let-row="row" let-col="col">
      <ng-container [ngSwitch]="col.key">
        
        <!-- ID Link -->
        <ng-container *ngSwitchCase="'id'">
          <a (click)="openHearingDetails(row)" href="javascript:void(0)" class="ov-link font-semibold">{{ row.code }}</a>
        </ng-container>
        
        <!-- custom badge with white box styling -->
        <ng-container *ngSwitchCase="'attachment'">
          <span class="ov-figma-badge bg-white text-defaulttextcolor border border-defaultborder min-w-[50px] !py-0.5 !px-2 rounded"
                                    (click)="linkClick(row.file_path )">
                                    {{ row.file_path!=null ? 'View File': 'N/A' }}
                                </span>

    
        </ng-container>
        
        <!-- action drop menu icon indicator -->
        <!-- <ng-container *ngSwitchCase="'action'">
          <span class="text-textmuted cursor-pointer font-bold">•••</span>
        </ng-container> -->
      </ng-container>
    </ng-template>
  </app-shared-table>
</div>

<app-reusable-modal
  *ngIf="showModal"
  [title]="selectedHearing ? 'Edit Hearing: #' + selectedHearing.code : 'Add Hearing'"
  subtitle="Enter hearing details"
  [saveText]="'Save'"
  (save)="saveHearing()"
  (close)="closeModal()">
  <form [formGroup]="hearingForm" class="p-4 flex flex-col gap-4">
    <div class="flex flex-col">
      <label class="ov-label text-xs font-semibold mb-1 text-defaulttextcolor">Date</label>
      <input type="date" formControlName="date" class="ov-input form-control rounded" placeholder="e.g. 22-07-2026">
    </div>
    <div class="flex flex-col">
      <label class="ov-label text-xs font-semibold mb-1 text-defaulttextcolor">Description</label>
      <textarea formControlName="description" rows="3" class="ov-input form-control rounded" placeholder="Enter Description"></textarea>
    </div>
    <div class="flex flex-col">
      <label class="ov-label text-xs font-semibold mb-1 text-defaulttextcolor">Attachment</label>
      <app-file-upload
      [accept]="'image/*'"
      [multiple]="false"
      [browseText]="'Click'"
      (filesChanged)="onFilesSelected($event)">
  </app-file-upload>
    </div>
  </form>
</app-reusable-modal>
