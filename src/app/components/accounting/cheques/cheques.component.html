<div class="chq-page">
  <div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between page-header !py-4">
    <div>
      <h3 class="ov-page-title">Cheques</h3>
      <p class="ov-page-sub">View and manage all your cheques</p>
    </div>
    <div class="flex flex-wrap gap-2 items-center mt-2 md:mt-0">
      <button type="button" class="ov-btn ov-btn-ghost">
        <img src="assets/images/work-orders/download.svg" alt="" width="18" height="18" />
        Export
      </button>
    </div>
  </div>

  <div class="chq-status-tabs mb-5 overflow-x-auto" role="tablist" aria-label="Cheque status">
    <div class="ov-seg ov-seg--tabs">
      <button
        type="button"
        *ngFor="let tab of statusTabs"
        class="ov-seg__btn"
        [class.is-active]="statusFilter === tab"
        (click)="setStatusFilter(tab)">
        {{ tab }}
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
    <div class="ov-card flex flex-col items-start gap-1.5 p-5" *ngFor="let kpi of kpis">
      <span class="ov-kpi__badge">{{ kpi.label }}</span>
      <div class="ov-kpi__val">{{ kpi.value }}</div>
      <div class="ov-kpi__sub">{{ kpi.sub }}</div>
    </div>
  </div>

  <div class="box mb-5 rounded-2xl overflow-visible bg-white border border-defaultborder shadow-none dark:bg-bodybg">
    <div class="ov-toolbar !border-b-0 !px-5 !h-auto min-h-10 !pt-5 !pb-0 flex-col sm:flex-row items-stretch sm:items-center">
      <div class="ov-search flex-1 max-w-none sm:max-w-[437px]">
        <label class="sr-only" for="cheque-search">Search</label>
        <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
        <input
          id="cheque-search"
          type="text"
          class="ov-input ov-search__input"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          placeholder="Search">
      </div>
      <div class="ov-toolbar__btns">
        <div class="relative" (click)="$event.stopPropagation()">
          <button type="button" (click)="toggleColumnDropdown($event)" class="ov-btn ov-btn-toolbar">
            <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
            Column
          </button>
          <app-column-menu
            *ngIf="showColumnDropdown"
            [columns]="tableColumns"
            (toggle)="toggleColumn($event)"
            (toggleAll)="toggleAllColumns($event)"
            (closed)="showColumnDropdown = false">
          </app-column-menu>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto px-5 pb-0 pt-5">
      <app-shared-table
        [columns]="visibleColumns"
        [data]="paginatedRows"
        [loading]="false"
        [hasActions]="false"
        [showPaginator]="false"
        [totalRecords]="totalRecords"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex">
        <ng-template #colTemplate let-row="row" let-col="col">
          <ng-container [ngSwitch]="col.key">
            <ng-container *ngSwitchCase="'id'">
              <a class="ov-link" href="javascript:void(0)">{{ row.id }}</a>
            </ng-container>
            <ng-container *ngSwitchCase="'status'">
              <span [ngClass]="statusClass(row.status)">{{ row.status }}</span>
            </ng-container>
            <ng-container *ngSwitchCase="'inHand'">
              <span [ngClass]="yesNoClass(row.inHand)">{{ row.inHand }}</span>
            </ng-container>
            <ng-container *ngSwitchCase="'returned'">
              <span [ngClass]="yesNoClass(row.returned)">{{ row.returned }}</span>
            </ng-container>
          </ng-container>
        </ng-template>
      </app-shared-table>
    </div>

    <div class="ov-page">
      <div class="ov-page__meta">
        <span class="ov-page__label">Show</span>
        <div class="ov-page__size">
          <select [(ngModel)]="pageSize" (change)="onPageSizeChange()">
            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="25">25</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="100">100</option>
          </select>
          <img src="assets/images/common/chevron-down.svg" alt="" width="14" height="14" />
        </div>
        <span>Showing {{ startRecord }} to {{ endRecord }} of {{ totalRecords }} records</span>
      </div>
      <div class="ov-page__nav">
        <span class="ov-page__label">Page {{ displayPage }} of {{ totalPages || 1 }}</span>
        <div class="ov-page__btns">
          <button type="button" class="ov-page__btn" (click)="previousPage()" [disabled]="displayPage <= 1" aria-label="Previous page">
            <img src="assets/images/common/chevron-down.svg" alt="" width="14" height="14" class="ov-page__chevron ov-page__chevron--prev" />
          </button>
          <ng-container *ngFor="let item of pagerItems">
            <span *ngIf="item === '...'" class="ov-page__ellipsis">...</span>
            <button *ngIf="item !== '...'" type="button" class="ov-page__btn"
              [class.is-active]="item === displayPage" (click)="goToPage(+item)">{{ item }}</button>
          </ng-container>
          <button type="button" class="ov-page__btn" (click)="nextPage()" [disabled]="displayPage >= totalPages" aria-label="Next page">
            <img src="assets/images/common/chevron-down.svg" alt="" width="14" height="14" class="ov-page__chevron ov-page__chevron--next" />
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
