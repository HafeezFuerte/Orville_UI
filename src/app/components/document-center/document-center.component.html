<!-- Document Center — Figma 3667:93499 -->
<div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between page-header !py-4">
  <div>
    <h3 class="ov-page-title">Document Center</h3>
    <p class="ov-page-sub">View and manage documents across your organisation</p>
  </div>
</div>

<div class="box mb-5 rounded-2xl overflow-visible bg-white border border-defaultborder shadow-none">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-defaultborder px-5 py-3">
    <h5 class="m-0 text-[16px] font-semibold leading-[21px] text-defaulttextcolor">Lists</h5>
    <div class="ov-seg overflow-x-auto max-w-full">
      <button
        type="button"
        *ngFor="let tab of tabs"
        class="ov-seg__btn"
        [class.is-active]="attachmentFilter === tab.id"
        (click)="setAttachmentFilter(tab.id)">
        {{ tab.label }}
      </button>
    </div>
  </div>

  <div class="ov-toolbar !border-b-0 !px-5 !h-auto min-h-10 !pt-5 !pb-0 flex-col sm:flex-row items-stretch sm:items-center">
    <div class="ov-search flex-1 max-w-none sm:max-w-[437px]">
      <label class="sr-only" for="document-center-search">Filter items by Document ID</label>
      <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
      <input
        id="document-center-search"
        type="text"
        class="ov-input ov-search__input"
        placeholder="Filter items by Document ID"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch()">
    </div>
    <div class="ov-toolbar__btns">
      <button type="button" class="ov-btn ov-btn-toolbar" (click)="toggleDrawer(true)" data-tooltip="Filter">
        <img src="assets/images/work-orders/filter.svg" alt="" width="18" height="18" />
        Filter
      </button>
      <div class="relative" (click)="$event.stopPropagation()">
        <button type="button" class="ov-btn ov-btn-toolbar" (click)="toggleColumnDropdown($event)" data-tooltip="Column">
          <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
          Column
        </button>
        <div
          *ngIf="showColumnDropdown"
          class="absolute end-0 z-30 mt-1.5 flex min-w-[180px] flex-col gap-2 rounded-lg border border-defaultborder bg-white p-3 shadow-lg dark:bg-bodybg">
          <label class="mb-1 flex cursor-pointer items-center gap-2 border-b border-defaultborder pb-1.5 text-[10px] font-bold uppercase text-defaulttextcolor">
            <input type="checkbox" [checked]="allColumnsSelected" (change)="toggleAllColumns($event)" class="h-3.5 w-3.5 rounded text-primary">
            Select All
          </label>
          <label
            *ngFor="let col of tableColumns"
            class="flex cursor-pointer items-center gap-2 text-xs text-textmuted hover:text-defaulttextcolor">
            <input type="checkbox" [checked]="col.visible !== false" (change)="toggleColumn(col.key)" class="h-3.5 w-3.5 rounded text-primary">
            {{ col.label }}
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="px-5 pb-5 pt-5">
    <app-shared-table
      [columns]="visibleColumns"
      [data]="pagedDocuments"
      [hasActions]="false"
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageNo"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onSharedTablePageChange($event)">
      <ng-template #colTemplate let-row="row" let-col="col">
        <ng-container [ngSwitch]="col.key">
          <ng-container *ngSwitchCase="'id'">
            <a [routerLink]="['/documents', row.id]" class="ov-link font-semibold">{{ row.id }}</a>
          </ng-container>
          <ng-container *ngSwitchCase="'status'">
            <span [class]="statusChip(row.status)">{{ row.status }}</span>
          </ng-container>
          <ng-container *ngSwitchCase="'expiryDate'">
            <span *ngIf="!row.expiryDate" class="ov-outline-chip ov-outline-chip--danger">No Expiry Date</span>
            <span *ngIf="row.expiryDate" class="text-[14px] text-textmuted">{{ row.expiryDate }}</span>
          </ng-container>
        </ng-container>
      </ng-template>
    </app-shared-table>
  </div>
</div>

<app-filter-drawer [(isOpen)]="showFilterDrawer" (apply)="onSearch()"></app-filter-drawer>
