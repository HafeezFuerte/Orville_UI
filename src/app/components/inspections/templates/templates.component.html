<!-- Page header -->
<div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between page-header !py-4">
  <div>
    <h3 class="ov-page-title">Templates</h3>
    <p class="ov-page-sub mt-1">Manage inspection templates and forms</p>
  </div>
  <div class="flex flex-wrap gap-2 items-center mt-2 md:mt-0">
    <button type="button" routerLink="/inspections/create-template" class="ov-btn ov-btn-primary">
      <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
      Create Template
    </button>
  </div>
</div>

<div (click)="closeActionMenu()" class="box mb-5 rounded-2xl overflow-visible bg-white border border-defaultborder shadow-none">

  <!-- Header row: title + tabs segment matching standard list pages -->
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-defaultborder px-5 py-3">
    <h5 class="m-0 text-[16px] font-semibold leading-[21px] text-defaulttextcolor">List</h5>
    <div class="ov-seg ov-seg--solid">
      <button type="button" (click)="filterByCreatedBy('All')" class="ov-seg__btn" [class.is-active]="activeFilter === 'All'">All</button>
      <button type="button" (click)="filterByCreatedBy('Admin')" class="ov-seg__btn" [class.is-active]="activeFilter === 'Admin'">Admin Template</button>
      <button type="button" (click)="filterByCreatedBy('User')" class="ov-seg__btn" [class.is-active]="activeFilter === 'User'">User Template</button>
    </div>
  </div>

  <!-- Toolbar: search + filter + column controls -->
  <div class="ov-toolbar !border-b-0 !px-5 !h-auto min-h-10 !pt-4 !pb-4 flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4">
    <div class="ov-search flex-1 max-w-none sm:max-w-[437px]">
      <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
      <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="applyFilters()"
        class="ov-input ov-search__input" placeholder="Search">
    </div>

    <div class="ov-toolbar__btns flex gap-3">
      <button type="button" (click)="isDrawerOpen = true" class="ov-btn ov-btn-toolbar">
        <img src="assets/images/work-orders/filter.svg" alt="" width="18" height="18" /> Filter
      </button>

      <div class="relative">
        <button type="button" (click)="toggleColumnDropdown()" class="ov-btn ov-btn-toolbar">
          <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" /> Column
        </button>
        <div *ngIf="isColumnDropdownOpen"
          class="absolute end-0 z-30 mt-1.5 flex min-w-[180px] flex-col gap-2 rounded-lg border border-defaultborder bg-white p-3 shadow-lg dark:bg-bodybg">
          <label class="mb-1 flex cursor-pointer items-center gap-2 border-b border-defaultborder pb-1.5 text-[10px] font-bold uppercase text-defaulttextcolor">
            <input type="checkbox" class="h-3.5 w-3.5 rounded text-primary"
              [checked]="allColumnsVisible" (change)="toggleAllColumns($event)">
            Select All
          </label>
          <label *ngFor="let col of columns"
            class="flex cursor-pointer items-center gap-2 text-xs text-textmuted hover:text-defaulttextcolor">
            <input type="checkbox" class="h-3.5 w-3.5 rounded text-primary"
              [checked]="col.visible !== false" (change)="toggleColumn(col)">
            {{ col.label }}
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters Side Drawer -->
  <app-filter-drawer
    [(isOpen)]="isDrawerOpen"
    [(selectedTag)]="filterTag"
    [(selectedArea)]="filterArea"
    [(selectedId)]="filterId"
    [(selectedRefNo)]="filterRefNo"
    [(selectedOffPlanStatus)]="filterOffPlanStatus"
    [(selectedLandlord)]="filterLandlord"
    [(selectedInternalStatus)]="filterInternalStatus"
    (apply)="applyFilters()"
    (clear)="resetFilters()">
  </app-filter-drawer>

  <!-- Grid Table rendering -->
  <div class="px-5 pb-5 pt-0">
    <app-shared-table [columns]="visibleColumns" [data]="filteredData" [loading]="isLoading" [hasActions]="false" [showPaginator]="true">
      <ng-template #colTemplate let-row="row" let-col="col">
        <ng-container [ngSwitch]="col.key">

          <ng-container *ngSwitchCase="'id'">
            <a routerLink="/inspections/template-details" class="ov-link font-semibold">{{ row.id }}</a>
          </ng-container>

          <ng-container *ngSwitchCase="'templateName'">
            <span class="text-defaulttextcolor font-semibold text-[13px]">{{ row.templateName }}</span>
          </ng-container>

          <ng-container *ngSwitchCase="'createdBy'">
            <span
              class="ov-status"
              [class.ov-status--active]="row.createdBy === 'Admin'"
              [class.ov-status--soft]="row.createdBy !== 'Admin'">
              {{ row.createdBy }}
            </span>
          </ng-container>

          <!-- Action menu trigger popup -->
          <ng-container *ngSwitchCase="'action'">
            <div class="relative inline-block">
              <span (click)="toggleActionMenu(row, $event)" class="text-textmuted cursor-pointer font-bold px-2 py-1 hover:text-defaulttextcolor">
                •••
              </span>
              <!-- Action dropdown list panel -->
              <div *ngIf="activeActionRow === row"
                class="absolute end-0 z-30 mt-1 flex min-w-[120px] flex-col gap-1 rounded-lg border border-defaultborder bg-white p-1.5 shadow-lg dark:bg-bodybg">
                <a routerLink="/inspections/template-details" class="flex items-center gap-2 px-3 py-1.5 text-xs text-textmuted hover:bg-light/50 hover:text-defaulttextcolor rounded">
                  View
                </a>
                <a [routerLink]="['/inspections/create-template']" [queryParams]="{ id: row.id }" class="flex items-center gap-2 px-3 py-1.5 text-xs text-textmuted hover:bg-light/50 hover:text-defaulttextcolor rounded">
                  Edit
                </a>
                <button type="button" class="flex w-full text-start items-center gap-2 px-3 py-1.5 text-xs text-danger hover:bg-danger/10 rounded">
                  Archive
                </button>
              </div>
            </div>
          </ng-container>

        </ng-container>
      </ng-template>
    </app-shared-table>
  </div>

</div>
