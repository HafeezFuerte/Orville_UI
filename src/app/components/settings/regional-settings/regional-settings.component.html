<div class="container-fluid py-4">
  <div class="d-md-flex d-block align-items-center justify-content-between mb-4 page-header-breadcrumb">
    <h1 class="page-title fw-semibold fs-18 mb-0">Regional Settings</h1>
  </div>

  <form [formGroup]="regionalSettingsForm" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-12 gap-6">
      
      <!-- Full Width Panel (No gap on the right side) -->
      <div class="col-span-12">
        
        <div class="box">
          <div class="box-header">
            <div>
              <h6 class="box-title mb-1">Regional Settings</h6>
              <p class="text-[#8c9097] dark:text-white/50 text-[0.75rem] mb-0">
                Used to calculate timezones, measurement unit, and currencies.
              </p>
            </div>
          </div>

          <div class="box-body">
            <div class="grid grid-cols-12 gap-4">
              
              <!-- Time Zone -->
              <div class="col-span-12 md:col-span-6">
                <label class="form-label">Time Zone <span class="text-danger">*</span></label>
                <ng-select [items]="timezones" bindLabel="name" bindValue="id" formControlName="timezone" placeholder="Select Time Zone"
                  [class.is-invalid]="regionalSettingsForm.get('timezone')?.touched && regionalSettingsForm.get('timezone')?.invalid">
                </ng-select>
                <div class="invalid-feedback d-block text-danger" *ngIf="regionalSettingsForm.get('timezone')?.touched && regionalSettingsForm.get('timezone')?.hasError('required')">
                  Time zone is required.
                </div>
              </div>

              <!-- Currency -->
              <div class="col-span-12 md:col-span-6">
                <label class="form-label">Currency <span class="text-danger">*</span></label>
                <ng-select [items]="currencies" bindLabel="displayName" bindValue="id" formControlName="currency" placeholder="Select Currency"
                  [class.is-invalid]="regionalSettingsForm.get('currency')?.touched && regionalSettingsForm.get('currency')?.invalid">
                </ng-select>
                <div class="invalid-feedback d-block text-danger" *ngIf="regionalSettingsForm.get('currency')?.touched && regionalSettingsForm.get('currency')?.hasError('required')">
                  Currency is required.
                </div>
              </div>

              <!-- Date Format -->
              <div class="col-span-12 md:col-span-4">
                <label class="form-label">Date Format <span class="text-danger">*</span></label>
                <ng-select [items]="dateFormats" bindLabel="name" bindValue="id" formControlName="dateFormat" placeholder="Select Date Format"
                  [class.is-invalid]="regionalSettingsForm.get('dateFormat')?.touched && regionalSettingsForm.get('dateFormat')?.invalid">
                </ng-select>
                <div class="invalid-feedback d-block text-danger" *ngIf="regionalSettingsForm.get('dateFormat')?.touched && regionalSettingsForm.get('dateFormat')?.hasError('required')">
                  Date format is required.
                </div>
              </div>

              <!-- Unit System -->
              <div class="col-span-12 md:col-span-4">
                <label class="form-label">Unit System <span class="text-danger">*</span></label>
                <ng-select [items]="unitSystems" bindLabel="name" bindValue="id" formControlName="unitSystem" placeholder="Select Unit System"
                  [class.is-invalid]="regionalSettingsForm.get('unitSystem')?.touched && regionalSettingsForm.get('unitSystem')?.invalid">
                </ng-select>
                <div class="invalid-feedback d-block text-danger" *ngIf="regionalSettingsForm.get('unitSystem')?.touched && regionalSettingsForm.get('unitSystem')?.hasError('required')">
                  Unit system is required.
                </div>
              </div>

              <!-- Default Payment Method -->
              <div class="col-span-12 md:col-span-4">
                <label class="form-label">Default Payment Method <span class="text-danger">*</span></label>
                <ng-select [items]="paymentMethods" bindLabel="name" bindValue="id" formControlName="defaultPaymentMethod" placeholder="Select Payment Method"
                  [class.is-invalid]="regionalSettingsForm.get('defaultPaymentMethod')?.touched && regionalSettingsForm.get('defaultPaymentMethod')?.invalid">
                </ng-select>
                <div class="invalid-feedback d-block text-danger" *ngIf="regionalSettingsForm.get('defaultPaymentMethod')?.touched && regionalSettingsForm.get('defaultPaymentMethod')?.hasError('required')">
                  Default payment method is required.
                </div>
              </div>

            </div>
          </div>

          <!-- Box Footer containing Action Buttons -->
          <div class="box-footer flex justify-end gap-2 border-t border-gray-200 p-4">
            <button type="button" class="ti-btn ti-btn-light !py-1 !px-4 !text-[0.75rem] font-semibold">Cancel</button>
            <button type="submit" class="ti-btn ti-btn-primary !py-1 !px-4 !text-[0.75rem] font-semibold" [disabled]="regionalSettingsForm.invalid">Update Settings</button>
          </div>
        </div>

      </div>
    </div>
  </form>
</div>
