<div class="flex flex-col gap-4 py-4 font-hanken">
  <div class="flex w-full flex-wrap items-center justify-between gap-4">
    <div class="flex min-w-0 flex-col gap-1.5">
      <h1 class="m-0 text-2xl font-bold leading-normal text-defaulttextcolor">Custom Fields</h1>
      <p class="m-0 text-[13px] font-normal leading-normal text-textmuted">
        Manage custom fields that can be assigned to various models.
      </p>
    </div>
  </div>

  <div class="flex w-full flex-wrap items-center justify-between gap-3">
    <label
      class="ov-inline-search h-10 w-full max-w-[360px] rounded-lg border border-defaultborder bg-white px-3.5 dark:bg-bodybg">
      <img
        src="./assets/images/settings/search.svg"
        alt=""
        width="14"
        height="14"
        class="shrink-0" />
      <input
        type="search"
        class="h-full w-full min-w-0 p-0 text-sm text-defaulttextcolor placeholder:text-textmuted"
        placeholder="Filter Fields by name"
        aria-label="Filter fields by name"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()" />
    </label>

    <div class="flex flex-wrap items-center gap-2">
      <div class="relative" data-filters-dropdown>
        <button
          type="button"
          class="ov-btn ov-btn-ghost cf-toolbar-btn"
          [attr.aria-expanded]="showFilters"
          (click)="toggleFilters()">
          <img src="./assets/images/work-orders/filter.svg" alt="" width="16" height="16" />
          <span>Filters{{ activeFilterCount ? ' (' + activeFilterCount + ')' : '' }}</span>
        </button>

        <div *ngIf="showFilters" class="cf-menu cf-menu--wide" (click)="$event.stopPropagation()">
          <p class="cf-menu__label">Module</p>
          <button
            type="button"
            class="cf-menu__item"
            [class.is-active]="filterModule === ''"
            (click)="applyFilterModule('')">
            All
          </button>
          <button
            type="button"
            class="cf-menu__item"
            *ngFor="let m of modules"
            [class.is-active]="filterModule === m"
            (click)="applyFilterModule(m)">
            {{ m }}
          </button>

          <p class="cf-menu__label">Data Type</p>
          <button
            type="button"
            class="cf-menu__item"
            [class.is-active]="filterDataType === ''"
            (click)="applyFilterDataType('')">
            All
          </button>
          <button
            type="button"
            class="cf-menu__item"
            *ngFor="let t of dataTypes"
            [class.is-active]="filterDataType === t"
            (click)="applyFilterDataType(t)">
            {{ t }}
          </button>

          <div class="cf-menu__footer">
            <button type="button" class="cf-menu__link" (click)="clearFilters()">Clear</button>
          </div>
        </div>
      </div>

      <div class="relative" data-columns-dropdown>
        <button
          type="button"
          class="ov-btn ov-btn-ghost cf-toolbar-btn"
          [attr.aria-expanded]="showColumns"
          (click)="toggleColumns()">
          <img src="./assets/images/work-orders/columns.svg" alt="" width="16" height="16" />
          <span>Columns</span>
        </button>

        <div *ngIf="showColumns" class="cf-menu" (click)="$event.stopPropagation()">
          <div class="border-b border-defaultborder p-2.5">
            <label
              class="ov-inline-search h-9 w-full rounded-lg border border-defaultborder bg-white px-3 dark:bg-bodybg">
              <img
                src="./assets/images/settings/search.svg"
                alt=""
                width="12"
                height="12"
                class="shrink-0" />
              <input
                type="search"
                class="h-full w-full min-w-0 p-0 text-xs text-defaulttextcolor placeholder:text-textmuted"
                placeholder="Search options..."
                [(ngModel)]="columnSearch" />
            </label>
          </div>
          <div class="cf-menu__list">
            <label class="flex cursor-pointer items-center gap-2 rounded-md px-1.5 py-1.5">
              <input
                type="checkbox"
                class="form-checkbox h-4 w-4 rounded border-defaultborder text-primary"
                [checked]="allColumnsSelected"
                (change)="toggleSelectAllColumns($any($event.target).checked)" />
              <span class="text-sm font-medium text-defaulttextcolor">(Select All)</span>
            </label>
            <label
              *ngFor="let col of filteredColumns"
              class="flex cursor-pointer items-center gap-2 rounded-md px-1.5 py-1.5">
              <input
                type="checkbox"
                class="form-checkbox h-4 w-4 rounded border-defaultborder text-primary"
                [(ngModel)]="col.visible" />
              <span class="text-sm text-defaulttextcolor">{{ col.label }}</span>
            </label>
          </div>
          <div class="cf-menu__footer">
            <button type="button" class="cf-menu__link" (click)="clearColumns()">Clear</button>
            <span class="h-3 w-px bg-defaultborder" aria-hidden="true"></span>
            <button type="button" class="cf-menu__close" (click)="closeColumns()">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    class="w-full overflow-hidden rounded-2xl border border-defaultborder bg-white dark:bg-bodybg"
    role="table"
    aria-label="Custom fields">
    <div class="w-full overflow-x-auto">
      <div
        class="cf-table__row cf-table__row--head"
        role="row"
        [style.grid-template-columns]="tableGridTemplate">
        <div
          *ngIf="isColumnVisible('fieldName')"
          class="cf-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="cf-sort" (click)="toggleSort('fieldName')">
            Field Name
            <span class="cf-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'fieldName' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'fieldName' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('fieldLabel')"
          class="cf-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="cf-sort" (click)="toggleSort('fieldLabel')">
            Field Label
            <span class="cf-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'fieldLabel' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'fieldLabel' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('dataType')"
          class="cf-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="cf-sort" (click)="toggleSort('dataType')">
            Data Type
            <span class="cf-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'dataType' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'dataType' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('module')"
          class="cf-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="cf-sort" (click)="toggleSort('module')">
            Module
            <span class="cf-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'module' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'module' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('visibleToTenant')"
          class="cf-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="cf-sort" (click)="toggleSort('visibleToTenant')">
            Visible to Tenant
            <span class="cf-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'visibleToTenant' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'visibleToTenant' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('visibleToLandlord')"
          class="cf-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="cf-sort" (click)="toggleSort('visibleToLandlord')">
            Visible to Landlord
            <span class="cf-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'visibleToLandlord' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'visibleToLandlord' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('useForVerification')"
          class="cf-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="cf-sort" (click)="toggleSort('useForVerification')">
            Use For Verification
            <span class="cf-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'useForVerification' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'useForVerification' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
      </div>

      <ng-container *ngIf="pagedRows.length > 0">
        <div
          *ngFor="let row of pagedRows"
          class="cf-table__row"
          role="row"
          [style.grid-template-columns]="tableGridTemplate">
          <div *ngIf="isColumnVisible('fieldName')" class="cf-table__cell" role="cell">
            <span class="cf-field-name">{{ row.fieldName }}</span>
          </div>
          <div *ngIf="isColumnVisible('fieldLabel')" class="cf-table__cell" role="cell">
            <span class="text-sm text-defaulttextcolor">{{ row.fieldLabel }}</span>
          </div>
          <div *ngIf="isColumnVisible('dataType')" class="cf-table__cell" role="cell">
            <span class="text-sm text-defaulttextcolor">{{ row.dataType }}</span>
          </div>
          <div *ngIf="isColumnVisible('module')" class="cf-table__cell" role="cell">
            <span class="text-sm text-defaulttextcolor">{{ row.module }}</span>
          </div>
          <div *ngIf="isColumnVisible('visibleToTenant')" class="cf-table__cell" role="cell">
            <span class="text-sm text-textmuted">{{ yesNo(row.visibleToTenant) }}</span>
          </div>
          <div *ngIf="isColumnVisible('visibleToLandlord')" class="cf-table__cell" role="cell">
            <span class="text-sm text-textmuted">{{ yesNo(row.visibleToLandlord) }}</span>
          </div>
          <div *ngIf="isColumnVisible('useForVerification')" class="cf-table__cell" role="cell">
            <span class="text-sm text-textmuted">{{ yesNo(row.useForVerification) }}</span>
          </div>
        </div>
      </ng-container>

      <div *ngIf="pagedRows.length === 0" class="cf-table-empty" role="row">
        <p class="cf-table-empty__text">{{ emptyMessage }}</p>
      </div>
    </div>
  </div>

  <app-ov-paginator
    *ngIf="totalFiltered > 0"
    [totalRecords]="totalFiltered"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[10, 25, 50]"
    (pageChange)="onPageChange($event)">
  </app-ov-paginator>
</div>
