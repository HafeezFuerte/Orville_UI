<div class="flex flex-col gap-4 py-4 font-hanken">
  <!-- Page header -->
  <div class="flex w-full flex-wrap items-center justify-between gap-4 overflow-hidden">
    <div class="flex min-w-0 flex-col gap-1.5">
      <h1 class="m-0 text-2xl font-bold leading-normal text-defaulttextcolor">
        Document Templates
      </h1>
      <p class="m-0 text-[13px] font-normal leading-normal text-textmuted">
        Create custom templates with prefilled lease elements and print from the lease page.
      </p>
    </div>
    <button type="button" class="ov-btn ov-btn-primary" (click)="openNew()">
      <span class="text-lg leading-none" aria-hidden="true">+</span>
      Add Document Template
    </button>
  </div>

  <!-- Toolbar -->
  <div class="flex w-full flex-wrap items-center justify-between gap-3">
    <div class="flex min-w-0 flex-wrap items-center gap-3">
      <label class="ov-inline-search h-10 w-full max-w-[360px] rounded-lg border border-defaultborder bg-white px-3.5 dark:bg-bodybg">
        <img
          src="./assets/images/settings/search.svg"
          alt=""
          width="14"
          height="14"
          class="shrink-0" />
        <input
          type="search"
          class="h-full w-full min-w-0 p-0 text-sm text-defaulttextcolor placeholder:text-textmuted"
          placeholder="Filter by document template..."
          aria-label="Filter by document template"
          [(ngModel)]="searchQuery" />
      </label>

      <div class="relative">
        <select
          class="ov-input cursor-pointer appearance-none pr-8"
          [(ngModel)]="typeFilter"
          aria-label="Filter by type">
          <option value="">Type</option>
          <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
        </select>
        <img
          src="./assets/images/settings/chevron-down.svg"
          alt=""
          width="12"
          height="12"
          class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2" />
      </div>
    </div>

    <span
      class="inline-flex shrink-0 items-center justify-center rounded-lg bg-[#eeeef5] px-3 py-1.5 text-xs font-medium text-primary dark:bg-white/10 dark:text-white">
      {{ countLabel }}
    </span>
  </div>

  <!-- Table -->
  <div
    class="w-full overflow-hidden rounded-2xl border border-defaultborder bg-white dark:bg-bodybg"
    role="table"
    aria-label="Document templates">
    <div
      class="flex gap-4 overflow-x-auto border-b border-bodybg px-5 py-3.5 dark:border-white/10"
      role="row">
      <div class="min-w-[200px] flex-1 text-xs font-semibold text-defaulttextcolor" role="columnheader">
        Title
      </div>
      <div class="w-[180px] shrink-0 text-xs font-semibold text-defaulttextcolor sm:w-[220px] lg:w-[280px]" role="columnheader">
        Type
      </div>
      <div class="w-[140px] shrink-0 text-xs font-semibold text-defaulttextcolor sm:w-[180px] lg:w-[220px]" role="columnheader">
        Updated
      </div>
      <div class="w-[100px] shrink-0 text-right text-xs font-semibold text-defaulttextcolor sm:w-[140px] lg:w-[177px]" role="columnheader">
        Actions
      </div>
    </div>

    <div
      *ngFor="let row of filteredTemplates"
      class="flex gap-4 overflow-x-auto border-t border-bodybg px-5 py-4 dark:border-white/10"
      role="row">
      <div class="flex min-w-[200px] flex-1 items-center" role="cell">
        <button
          type="button"
          class="text-link cursor-pointer border-0 bg-transparent p-0 text-left text-sm font-medium underline"
          (click)="openEdit(row)">
          {{ row.title }}
        </button>
      </div>
      <div class="flex w-[180px] shrink-0 items-center sm:w-[220px] lg:w-[280px]" role="cell">
        <span
          class="inline-flex items-center rounded-md bg-[#eeeef5] px-2.5 py-1 text-xs font-medium text-primary dark:bg-white/10 dark:text-white">
          {{ row.type }}
        </span>
      </div>
      <div
        class="flex w-[140px] shrink-0 items-center text-sm font-normal text-textmuted sm:w-[180px] lg:w-[220px]"
        role="cell">
        {{ row.updated }}
      </div>
      <div
        class="flex w-[100px] shrink-0 items-center justify-end gap-2 sm:w-[140px] lg:w-[177px]"
        role="cell">
        <button
          type="button"
          class="ov-icon-btn"
          aria-label="Edit template"
          (click)="openEdit(row)">
          <img src="./assets/images/settings/pencil.svg" alt="" width="14" height="14" />
        </button>
        <button
          type="button"
          class="ov-icon-btn ov-icon-btn--danger"
          aria-label="Delete template"
          (click)="deleteTemplate(row)">
          <img src="./assets/images/settings/trash.svg" alt="" width="14" height="14" />
        </button>
      </div>
    </div>

    <div
      *ngIf="filteredTemplates.length === 0"
      class="px-5 py-10 text-center text-sm text-textmuted">
      No document templates found.
    </div>
  </div>
</div>
