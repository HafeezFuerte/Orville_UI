<div class="flex flex-col gap-4 py-4 font-hanken">
  <!-- Page header -->
  <div class="flex w-full flex-wrap items-center justify-between gap-4 overflow-hidden">
    <div class="flex min-w-0 flex-col gap-1.5">
      <h1 class="m-0 text-2xl font-bold leading-normal text-defaulttextcolor">PDF Builder</h1>
      <p class="m-0 text-[13px] font-normal leading-normal text-textmuted">
        Create custom PDF prints with prefilled elements and print them from the lease page.
      </p>
    </div>
    <button type="button" class="ov-btn ov-btn-primary" (click)="openNew()">
      <span class="text-lg leading-none" aria-hidden="true">+</span>
      Add PDF
    </button>
  </div>

  <!-- Toolbar -->
  <div class="flex w-full flex-wrap items-center justify-between gap-3">
    <label
      class="ov-inline-search h-10 w-full max-w-[360px] rounded-lg border border-defaultborder bg-white px-3.5 dark:bg-bodybg">
      <img
        src="./assets/images/settings/search.svg"
        alt=""
        width="14"
        height="14"
        class="shrink-0" />
      <input
        type="search"
        class="h-full w-full min-w-0 p-0 text-sm text-defaulttextcolor placeholder:text-textmuted"
        placeholder="Search PDF templates..."
        aria-label="Search PDF templates"
        [(ngModel)]="searchQuery" />
    </label>

    <span
      class="inline-flex shrink-0 items-center justify-center rounded-lg bg-[#eeeef5] px-3 py-1.5 text-xs font-medium text-primary dark:bg-white/10 dark:text-white">
      {{ countLabel }}
    </span>
  </div>

  <!-- Table -->
  <div
    class="w-full overflow-hidden rounded-2xl border border-defaultborder bg-white dark:bg-bodybg"
    role="table"
    aria-label="PDF templates">
    <div
      class="flex gap-4 overflow-x-auto bg-bodybg px-5 py-3.5 dark:bg-white/5"
      role="row">
      <div
        class="min-w-[180px] flex-1 text-xs font-semibold text-textmuted"
        role="columnheader">
        Name
      </div>
      <div
        class="w-[160px] shrink-0 text-xs font-semibold text-textmuted sm:w-[220px] lg:w-[280px]"
        role="columnheader">
        Template type
      </div>
      <div
        class="w-[140px] shrink-0 text-xs font-semibold text-textmuted sm:w-[180px] lg:w-[220px]"
        role="columnheader">
        File
      </div>
      <div
        class="w-[100px] shrink-0 text-right text-xs font-semibold text-textmuted sm:w-[140px] lg:w-[233px]"
        role="columnheader">
        Actions
      </div>
    </div>

    <div
      *ngFor="let row of filteredTemplates"
      class="flex gap-4 overflow-x-auto border-t border-defaultborder px-5 py-4"
      role="row">
      <div class="flex min-w-[180px] flex-1 items-center" role="cell">
        <button
          type="button"
          class="text-link cursor-pointer border-0 bg-transparent p-0 text-left text-sm font-medium underline"
          (click)="openEdit(row)">
          {{ row.name }}
        </button>
      </div>
      <div
        class="flex w-[160px] shrink-0 items-center sm:w-[220px] lg:w-[280px]"
        role="cell">
        <span
          class="inline-flex items-center rounded-md bg-[#eeeef5] px-2.5 py-1 text-xs font-medium text-primary dark:bg-white/10 dark:text-white">
          {{ row.templateType }}
        </span>
      </div>
      <div
        class="flex w-[140px] shrink-0 items-center sm:w-[180px] lg:w-[220px]"
        role="cell">
        <button
          type="button"
          class="inline-flex h-7 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-defaultborder bg-bodybg px-2.5 text-xs font-medium text-link"
          (click)="openPdf(row)">
          <img
            src="./assets/images/settings/external-link-blue.svg"
            alt=""
            width="16"
            height="16"
            class="shrink-0" />
          Open PDF
        </button>
      </div>
      <div
        class="flex w-[100px] shrink-0 items-center justify-end gap-2 sm:w-[140px] lg:w-[233px]"
        role="cell">
        <button
          type="button"
          class="ov-icon-btn"
          aria-label="Edit PDF template"
          (click)="openEdit(row)">
          <img src="./assets/images/settings/pencil.svg" alt="" width="14" height="14" />
        </button>
        <button
          type="button"
          class="ov-icon-btn ov-icon-btn--danger"
          aria-label="Delete PDF template"
          (click)="deleteTemplate(row)">
          <img src="./assets/images/settings/trash.svg" alt="" width="14" height="14" />
        </button>
      </div>
    </div>

    <div
      *ngIf="filteredTemplates.length === 0"
      class="border-t border-defaultborder px-5 py-10 text-center text-sm text-textmuted">
      No PDF templates found.
    </div>
  </div>
</div>
