<div class="flex flex-col gap-4 py-4 font-hanken">
  <div class="flex w-full flex-wrap items-center justify-between gap-4">
    <div class="flex min-w-0 flex-col gap-1.5">
      <h1 class="m-0 text-2xl font-bold leading-normal text-defaulttextcolor">
        Internal Statuses
      </h1>
      <p class="m-0 text-[13px] font-normal leading-normal text-textmuted">
        Edit is disabled for internal statuses that have associated records.
      </p>
    </div>
    <button type="button" class="ov-btn ov-btn-primary" (click)="openCreate()">
      <span class="text-lg leading-none" aria-hidden="true">+</span>
      Add New
    </button>
  </div>

  <div class="flex w-full flex-wrap items-center justify-between gap-3">
    <label
      class="ov-inline-search h-10 w-full max-w-[360px] rounded-lg border border-defaultborder bg-white px-3.5 dark:bg-bodybg">
      <img
        src="./assets/images/settings/search.svg"
        alt=""
        width="14"
        height="14"
        class="shrink-0" />
      <input
        type="search"
        class="h-full w-full min-w-0 p-0 text-sm text-defaulttextcolor placeholder:text-textmuted"
        placeholder="Filter fields by name"
        aria-label="Filter internal statuses by name"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()" />
    </label>

    <div class="flex flex-wrap items-center gap-2">
      <div class="relative" data-filters-dropdown>
        <button
          type="button"
          class="ov-btn ov-btn-ghost is-toolbar-btn"
          [attr.aria-expanded]="showFilters"
          (click)="toggleFilters()">
          <img src="./assets/images/work-orders/filter.svg" alt="" width="16" height="16" />
          <span>Filters{{ activeFilterCount ? ' (' + activeFilterCount + ')' : '' }}</span>
        </button>

        <div *ngIf="showFilters" class="is-menu" (click)="$event.stopPropagation()">
          <p class="is-menu__label">Module</p>
          <button
            type="button"
            class="is-menu__item"
            [class.is-active]="filterModule === ''"
            (click)="applyFilterModule('')">
            All
          </button>
          <button
            type="button"
            class="is-menu__item"
            *ngFor="let m of modules"
            [class.is-active]="filterModule === m"
            (click)="applyFilterModule(m)">
            {{ m }}
          </button>
          <div class="is-menu__footer">
            <button type="button" class="is-menu__link" (click)="clearFilters()">Clear</button>
          </div>
        </div>
      </div>

      <div class="relative" data-columns-dropdown>
        <button
          type="button"
          class="ov-btn ov-btn-ghost is-toolbar-btn"
          [attr.aria-expanded]="showColumns"
          (click)="toggleColumns()">
          <img src="./assets/images/work-orders/columns.svg" alt="" width="16" height="16" />
          <span>Columns</span>
        </button>

        <div *ngIf="showColumns" class="is-menu" (click)="$event.stopPropagation()">
          <div class="border-b border-defaultborder p-2.5">
            <label
              class="ov-inline-search h-9 w-full rounded-lg border border-defaultborder bg-white px-3 dark:bg-bodybg">
              <img
                src="./assets/images/settings/search.svg"
                alt=""
                width="12"
                height="12"
                class="shrink-0" />
              <input
                type="search"
                class="h-full w-full min-w-0 p-0 text-xs text-defaulttextcolor placeholder:text-textmuted"
                placeholder="Search options..."
                [(ngModel)]="columnSearch" />
            </label>
          </div>
          <div class="is-menu__list">
            <label class="flex cursor-pointer items-center gap-2 rounded-md px-1.5 py-1.5">
              <input
                type="checkbox"
                class="form-checkbox h-4 w-4 rounded border-defaultborder text-primary"
                [checked]="allColumnsSelected"
                (change)="toggleSelectAllColumns($any($event.target).checked)" />
              <span class="text-sm font-medium text-defaulttextcolor">(Select All)</span>
            </label>
            <label
              *ngFor="let col of filteredColumns"
              class="flex cursor-pointer items-center gap-2 rounded-md px-1.5 py-1.5">
              <input
                type="checkbox"
                class="form-checkbox h-4 w-4 rounded border-defaultborder text-primary"
                [(ngModel)]="col.visible" />
              <span class="text-sm text-defaulttextcolor">{{ col.label }}</span>
            </label>
          </div>
          <div class="is-menu__footer">
            <button type="button" class="is-menu__link" (click)="clearColumns()">Clear</button>
            <span class="h-3 w-px bg-defaultborder" aria-hidden="true"></span>
            <button type="button" class="is-menu__close" (click)="closeColumns()">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    class="w-full overflow-hidden rounded-2xl border border-defaultborder bg-white dark:bg-bodybg"
    role="table"
    aria-label="Internal statuses">
    <div class="w-full overflow-x-auto">
      <div
        class="is-table__row is-table__row--head"
        role="row"
        [style.grid-template-columns]="tableGridTemplate">
        <div
          *ngIf="isColumnVisible('name')"
          class="is-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="is-sort" (click)="toggleSort('name')">
            Name
            <span class="is-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'name' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'name' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('module')"
          class="is-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="is-sort" (click)="toggleSort('module')">
            Module
            <span class="is-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'module' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'module' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('color')"
          class="is-table__cell text-xs font-semibold text-textmuted"
          role="columnheader">
          <button type="button" class="is-sort" (click)="toggleSort('colorKey')">
            Color
            <span class="is-sort__icons" aria-hidden="true">
              <span [class.is-active]="sortKey === 'colorKey' && sortDir === 'asc'">▲</span>
              <span [class.is-active]="sortKey === 'colorKey' && sortDir === 'desc'">▼</span>
            </span>
          </button>
        </div>
        <div
          *ngIf="isColumnVisible('actions')"
          class="is-table__cell is-table__cell--action text-xs font-semibold text-textmuted"
          role="columnheader">
          Action
        </div>
      </div>

      <ng-container *ngIf="pagedRows.length > 0">
        <div
          *ngFor="let row of pagedRows"
          class="is-table__row"
          role="row"
          [style.grid-template-columns]="tableGridTemplate">
          <div *ngIf="isColumnVisible('name')" class="is-table__cell" role="cell">
            <button
              type="button"
              class="is-name-link"
              [disabled]="!canEdit(row)"
              (click)="openEdit(row)">
              {{ row.name }}
            </button>
          </div>
          <div *ngIf="isColumnVisible('module')" class="is-table__cell" role="cell">
            <span class="text-sm text-defaulttextcolor">{{ row.module }}</span>
          </div>
          <div *ngIf="isColumnVisible('color')" class="is-table__cell" role="cell">
            <span class="is-color">
              <span
                class="is-color__swatch"
                [style.background]="colorCss(row.colorKey)"
                aria-hidden="true"></span>
              <span class="text-sm text-defaulttextcolor">{{ colorLabel(row.colorKey) }}</span>
            </span>
          </div>
          <div
            *ngIf="isColumnVisible('actions')"
            class="is-table__cell is-table__cell--action"
            role="cell">
            <button
              type="button"
              class="ov-icon-btn"
              aria-label="Edit internal status"
              [disabled]="!canEdit(row)"
              [attr.title]="
                canEdit(row)
                  ? 'Edit'
                  : 'Edit is disabled for internal statuses that have associated records'
              "
              (click)="openEdit(row)">
              <img src="./assets/images/settings/pencil.svg" alt="" width="14" height="14" />
            </button>
            <button
              type="button"
              class="ov-icon-btn ov-icon-btn--danger"
              aria-label="Delete internal status"
              (click)="deleteRow(row)">
              <img src="./assets/images/settings/trash.svg" alt="" width="14" height="14" />
            </button>
          </div>
        </div>
      </ng-container>

      <div *ngIf="pagedRows.length === 0" class="is-table-empty" role="row">
        <p class="is-table-empty__text">{{ emptyMessage }}</p>
      </div>
    </div>
  </div>

  <app-ov-paginator
    *ngIf="totalFiltered > 0"
    [totalRecords]="totalFiltered"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[10, 25, 50]"
    (pageChange)="onPageChange($event)">
  </app-ov-paginator>
</div>

<div
  *ngIf="modalOpen"
  class="ov-modal-backdrop"
  (click)="closeModal()"
  role="presentation">
  <div
    class="flex w-full max-w-[520px] flex-col items-end gap-2.5"
    role="dialog"
    aria-modal="true"
    aria-labelledby="is-modal-title"
    (click)="$event.stopPropagation()">
    <button type="button" class="ov-modal-close" aria-label="Close" (click)="closeModal()">
      <img
        src="./assets/images/common/close-plus.svg"
        alt=""
        width="20"
        height="20"
        class="ov-ico-x" />
    </button>

    <div
      class="w-full overflow-hidden rounded-2xl border border-defaultborder bg-white shadow-[0_8px_24px_rgba(0,0,0,0.12)] dark:bg-bodybg">
      <div class="flex flex-col gap-[18px] px-5 pt-5">
        <h2 id="is-modal-title" class="m-0 text-base font-semibold text-defaulttextcolor">
          {{ modalTitle }}
        </h2>
        <div class="h-px w-full bg-defaultborder"></div>
      </div>

      <div class="flex flex-col gap-4 p-5">
        <div class="flex min-w-0 flex-col gap-2">
          <label class="ov-label" for="is-name">
            Name <span class="text-danger">*</span>
          </label>
          <input
            id="is-name"
            type="text"
            class="ov-input"
            placeholder="Enter internal status name"
            [(ngModel)]="draft.name" />
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div class="flex min-w-0 flex-col gap-2">
            <label class="ov-label" for="is-module">
              Module <span class="text-danger">*</span>
            </label>
            <div class="relative">
              <select
                id="is-module"
                class="ov-input cursor-pointer appearance-none pr-8"
                [(ngModel)]="draft.module">
                <option value="" disabled>Select module</option>
                <option *ngFor="let m of modules" [ngValue]="m">{{ m }}</option>
              </select>
              <img
                src="./assets/images/settings/chevron-down.svg"
                alt=""
                width="12"
                height="12"
                class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2" />
            </div>
          </div>

          <div class="flex min-w-0 flex-col gap-2">
            <label class="ov-label" for="is-color">
              Color <span class="text-danger">*</span>
            </label>
            <div class="relative">
              <select
                id="is-color"
                class="ov-input cursor-pointer appearance-none pr-8"
                [(ngModel)]="draft.colorKey">
                <option value="" disabled>Select color</option>
                <option *ngFor="let c of colors" [ngValue]="c.key">{{ c.label }}</option>
              </select>
              <img
                src="./assets/images/settings/chevron-down.svg"
                alt=""
                width="12"
                height="12"
                class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2" />
            </div>
          </div>
        </div>
      </div>

      <div
        class="flex flex-wrap items-center justify-end gap-2.5 border-t border-defaultborder px-5 py-4">
        <button type="button" class="ov-btn ov-btn-ghost" (click)="closeModal()">Cancel</button>
        <button
          type="button"
          class="ov-btn ov-btn-primary"
          [disabled]="!canSubmit"
          (click)="save()">
          Submit
        </button>
      </div>
    </div>
  </div>
</div>
