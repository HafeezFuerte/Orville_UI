<div>
  <div class="page-header !py-4 flex flex-col gap-5 md:flex-row md:items-start md:justify-between">
    <div>
      <h3 class="ov-page-title">{{ 'web.bookings.reservations.title' | translate }}</h3>
      <p class="ov-page-sub">{{ 'web.bookings.reservations.sub' | translate }}</p>
    </div>
    <div class="mt-2 md:mt-0 flex flex-wrap items-center gap-2">
      <button type="button" class="ov-btn ov-btn-primary" (click)="goToAdd()">
        <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
        {{ 'web.bookings.reservations.addReservation' | translate }}
      </button>
    </div>
  </div>

  <div class="box mb-5 overflow-visible rounded-2xl border border-defaultborder bg-white shadow-none dark:bg-bodybg">
    <div class="ov-toolbar !h-auto min-h-10 !border-b-0 !px-5 !pt-5 !pb-0 flex-col items-stretch sm:flex-row sm:items-center">
      <div class="flex items-center gap-2 flex-1 max-w-none sm:max-w-[490px]">
        <div class="ov-search flex-1">
          <label class="sr-only" for="reservation-search">{{ 'web.common.search' | translate }}</label>
          <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
          <input id="reservation-search" type="text" class="ov-input ov-search__input"
            [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" (input)="applyLocalSearch()" [placeholder]="'web.common.search' | translate">
        </div>
        <button type="button" (click)="onSearch()" class="ov-btn ov-btn-primary !h-10 !px-3" [title]="'web.common.search' | translate">
          <i class="ri-search-line text-[18px]"></i>
        </button>
      </div>
      <div class="ov-toolbar__btns">
        <button type="button" class="ov-btn ov-btn-toolbar" (click)="isDrawerOpen = true">
          <img src="assets/images/work-orders/filter.svg" alt="" width="18" height="18" />
          {{ 'web.common.filter' | translate }}
        </button>
        <div class="relative" (click)="$event.stopPropagation()">
          <button type="button" class="ov-btn ov-btn-toolbar" (click)="toggleColumnDropdown($event)">
            <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
            {{ 'web.common.column' | translate }}
          </button>
          <app-column-menu
            *ngIf="showColumnDropdown"
            [columns]="tableColumns"
            (toggle)="toggleColumn($event)"
            (toggleAll)="toggleAllColumns($event)"
            (closed)="showColumnDropdown = false">
          </app-column-menu>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto px-5 pb-0 pt-5">
      <app-shared-table
        [columns]="visibleColumns"
        [data]="allRows"
        [loading]="false"
        [hasActions]="false"
        [showPaginator]="false"
        [totalRecords]="totalRecords"
        [pageSize]="pageSize"
        [pageIndex]="pageNo">
        <ng-template #colTemplate let-row="row" let-col="col">
          <ng-container [ngSwitch]="col.key">
            <a *ngSwitchCase="'code'" class="ov-link" [routerLink]="['/bookings/reservations', row.code]">{{ row.code }}</a>
            <a *ngSwitchCase="'reservation_name'" class="ov-link" [routerLink]="['/bookings/reservations', row.code]">{{ row.reservation_name }}</a>
            <a *ngSwitchCase="'space_name'" class="ov-link" [routerLink]="['/bookings/spaces',row.space_code]">{{ row.space_name }}</a>
            <ng-container *ngSwitchCase="'status'">
              <span *ngIf="row.status" class="sd-status">{{ row.status }}</span>
              <span *ngIf="!row.status" class="sd-empty-cell">-</span>
            </ng-container>

            <button *ngSwitchCase="'action'" type="button" class="ov-icon-btn ov-icon-btn--bare" aria-label="Row actions">
              <img src="assets/images/common/dots-vertical.svg" alt="" width="20" height="20" class="ov-action-ico" />
            </button>
            <span *ngSwitchDefault>{{ row[col.key] }}</span>
          </ng-container>
        </ng-template>
      </app-shared-table>
    </div>

    <app-ov-paginator
    [totalRecords]="totalRecords"
    [pageSize]="pageSize"
    [pageIndex]="pageNo"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPaginatorChange($event)">
  </app-ov-paginator>
  </div>
</div>

<app-filter-drawer [(isOpen)]="isDrawerOpen" (apply)="applyFilters()" (clear)="clearFilters()">
  <div class="flex flex-col gap-4 text-[11px]">
    <div class="flex flex-col">
      <label class="ov-label mb-1.5">{{ 'web.bookings.reservations.filterName' | translate }}</label>
      <input type="text" class="ov-input" [(ngModel)]="filterName" [placeholder]="'web.bookings.reservations.phEnterName' | translate">
    </div>
    <div class="flex flex-col">
      <label class="ov-label mb-1.5">{{ 'web.bookings.reservations.filterStatus' | translate }}</label>
      <ng-select [(ngModel)]="filterStatus" [items]="statusOptions" [clearable]="true"
        [placeholder]="'web.bookings.reservations.phSelect' | translate" class="ov-select ng-select-sm w-full" appendTo="body"></ng-select>
    </div>
  </div>
</app-filter-drawer>
