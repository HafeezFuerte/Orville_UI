<div>
  <div class="page-header !py-4 flex flex-col gap-5 md:flex-row md:items-start md:justify-between">
    <div>
      <h3 class="ov-page-title">Reservations</h3>
      <p class="ov-page-sub">Manage and view all your Reservations</p>
    </div>
    <div class="mt-2 md:mt-0 flex flex-wrap items-center gap-2">
      <button type="button" class="ov-btn ov-btn-primary" (click)="goToAdd()">
        <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
        Add Reservation
      </button>
    </div>
  </div>

  <div class="box mb-5 overflow-visible rounded-2xl border border-defaultborder bg-white shadow-none dark:bg-bodybg">
    <div class="ov-toolbar !h-auto min-h-10 !border-b-0 !px-5 !pt-5 !pb-0 flex-col items-stretch sm:flex-row sm:items-center">
      <div class="ov-search max-w-none flex-1 sm:max-w-[437px]">
        <label class="sr-only" for="reservation-search">Search</label>
        <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
        <input id="reservation-search" type="text" class="ov-input ov-search__input"
          [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Search">
      </div>
      <div class="ov-toolbar__btns">
        <button type="button" class="ov-btn ov-btn-toolbar" (click)="isDrawerOpen = true">
          <img src="assets/images/work-orders/filter.svg" alt="" width="18" height="18" />
          Filter
        </button>
        <div class="relative" (click)="$event.stopPropagation()">
          <button type="button" class="ov-btn ov-btn-toolbar" (click)="toggleColumnDropdown($event)">
            <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
            Column
          </button>
          <app-column-menu
            *ngIf="showColumnDropdown"
            [columns]="tableColumns"
            (toggle)="toggleColumn($event)"
            (toggleAll)="toggleAllColumns($event)"
            (closed)="showColumnDropdown = false">
          </app-column-menu>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto px-5 pb-0 pt-5">
      <app-shared-table
        [columns]="visibleColumns"
        [data]="paginatedRows"
        [loading]="false"
        [hasActions]="false"
        [showPaginator]="false"
        [totalRecords]="totalRecords"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex">
        <ng-template #colTemplate let-row="row" let-col="col">
          <ng-container [ngSwitch]="col.key">
            <a *ngSwitchCase="'id'" class="ov-link" [routerLink]="['/bookings/reservations', row.id]">{{ row.id }}</a>
            <a *ngSwitchCase="'name'" class="ov-link" [routerLink]="['/bookings/reservations', row.id]">{{ row.name }}</a>
            <a *ngSwitchCase="'space'" class="ov-link" [routerLink]="['/bookings/spaces']">{{ row.space }}</a>
            <button *ngSwitchCase="'action'" type="button" class="ov-icon-btn ov-icon-btn--bare" aria-label="Row actions">
              <img src="assets/images/common/dots-vertical.svg" alt="" width="20" height="20" class="ov-action-ico" />
            </button>
            <span *ngSwitchDefault>{{ row[col.key] }}</span>
          </ng-container>
        </ng-template>
      </app-shared-table>
    </div>

    <div class="ov-page">
      <div class="ov-page__meta">
        <span class="ov-page__label">Show</span>
        <div class="ov-page__size">
          <select [(ngModel)]="pageSize" (change)="onPageSizeChange()">
            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="25">25</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="100">100</option>
          </select>
          <img src="assets/images/common/chevron-down.svg" alt="" width="14" height="14" />
        </div>
        <span>Showing {{ startRecord }} to {{ endRecord }} of {{ totalRecords }} records</span>
      </div>
      <div class="ov-page__nav">
        <span class="ov-page__label">Page {{ displayPage }} of {{ totalPages || 1 }}</span>
        <div class="ov-page__btns">
          <button type="button" class="ov-page__btn" (click)="previousPage()" [disabled]="displayPage <= 1" aria-label="Previous page">
            <img src="assets/images/common/chevron-down.svg" alt="" width="14" height="14" class="ov-page__chevron ov-page__chevron--prev" />
          </button>
          <ng-container *ngFor="let item of pagerItems">
            <span *ngIf="item === '...'" class="ov-page__ellipsis">...</span>
            <button *ngIf="item !== '...'" type="button" class="ov-page__btn"
              [class.is-active]="item === displayPage" (click)="goToPage(+item)">{{ item }}</button>
          </ng-container>
          <button type="button" class="ov-page__btn" (click)="nextPage()" [disabled]="displayPage >= totalPages" aria-label="Next page">
            <img src="assets/images/common/chevron-down.svg" alt="" width="14" height="14" class="ov-page__chevron ov-page__chevron--next" />
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-filter-drawer [(isOpen)]="isDrawerOpen" (apply)="applyFilters()" (clear)="clearFilters()">
  <div class="flex flex-col gap-4 text-[11px]">
    <div class="flex flex-col">
      <label class="ov-label mb-1.5">Filter by Reservation Name</label>
      <input type="text" class="ov-input" [(ngModel)]="filterName" placeholder="Enter name">
    </div>
    <div class="flex flex-col">
      <label class="ov-label mb-1.5">Filter by Status</label>
      <ng-select [(ngModel)]="filterStatus" [items]="statusOptions" [clearable]="true"
        placeholder="Select" class="ov-select ng-select-sm w-full" appendTo="body"></ng-select>
    </div>
  </div>
</app-filter-drawer>
