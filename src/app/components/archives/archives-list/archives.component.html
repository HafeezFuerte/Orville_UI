<!-- Archives — screenshot SoT (no Figma node) -->
<div class="archives-page">
  <div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between page-header !py-4">
    <div>
      <h3 class="ov-page-title">Archives</h3>
      <p class="ov-page-sub">
        Browse archived and deleted records — restore them or delete them permanently.
      </p>
    </div>
    <div class="flex flex-wrap gap-2 items-center mt-2 md:mt-0">
      <button type="button" class="ov-btn ov-btn-ghost" data-tooltip="Export" (click)="onExport()">
        <img src="assets/images/work-orders/download.svg" alt="" width="18" height="18" />
        Export
      </button>
    </div>
  </div>

  <div class="box mb-5 rounded-2xl overflow-visible bg-white dark:bg-bodybg border border-defaultborder shadow-none">
    <div class="archives-tabs border-b border-defaultborder px-3 sm:px-5">
      <div class="ov-seg archives-tabs__scroll overflow-x-auto max-w-full">
        <button
          type="button"
          *ngFor="let tab of tabs"
          class="ov-seg__btn whitespace-nowrap"
          [class.is-active]="activeTab === tab.id"
          (click)="setTab(tab.id)">
          {{ tab.label }}
        </button>
      </div>
    </div>

    <div
      class="ov-toolbar !border-b-0 !px-5 !h-auto min-h-10 !pt-5 !pb-0 flex-col sm:flex-row items-stretch sm:items-center">
      <div class="ov-search flex-1 max-w-none sm:max-w-[437px]">
        <label class="sr-only" for="archives-search">Search by name, address or city</label>
        <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
        <input
          id="archives-search"
          type="text"
          class="ov-input ov-search__input"
          placeholder="Search by name, address or city..."
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()" />
      </div>
      <div class="ov-toolbar__btns">
        <div class="relative" (click)="$event.stopPropagation()">
          <button
            type="button"
            class="ov-btn ov-btn-toolbar"
            (click)="toggleColumnDropdown($event)"
            data-tooltip="Columns">
            <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
            Columns
          </button>
          <div
            *ngIf="showColumnDropdown"
            class="absolute end-0 z-30 mt-1.5 flex min-w-[180px] flex-col gap-2 rounded-lg border border-defaultborder bg-white p-3 shadow-lg dark:bg-bodybg">
            <label
              class="mb-1 flex cursor-pointer items-center gap-2 border-b border-defaultborder pb-1.5 text-[10px] font-bold uppercase text-defaulttextcolor">
              <input
                type="checkbox"
                [checked]="allColumnsSelected"
                (change)="toggleAllColumns($event)"
                class="h-3.5 w-3.5 rounded text-primary" />
              Select All
            </label>
            <label
              *ngFor="let col of tableColumns"
              class="flex cursor-pointer items-center gap-2 text-xs text-textmuted hover:text-defaulttextcolor"
              [class.hidden]="col.key === 'select' || col.key === 'actions'">
              <input
                type="checkbox"
                [checked]="col.visible !== false"
                (change)="toggleColumn(col.key)"
                class="h-3.5 w-3.5 rounded text-primary" />
              {{ col.label }}
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="px-5 pb-5 pt-5">
      <app-shared-table
        [columns]="visibleColumns"
        [data]="pagedRows"
        [hasActions]="false"
        [emptyMessage]="'No archived records'"
        [totalRecords]="totalRecords"
        [pageSize]="pageSize"
        [pageIndex]="pageNo"
        [pageSizeOptions]="pageSizeOptions"
        (pageChange)="onSharedTablePageChange($event)">
        <ng-template #headerTemplate let-col="col">
          <ng-container *ngIf="col.key === 'select'; else plainHeader">
            <input
              type="checkbox"
              class="h-3.5 w-3.5 rounded text-primary"
              [checked]="allPageSelected"
              (change)="toggleSelectAll($event)"
              aria-label="Select all on page" />
          </ng-container>
          <ng-template #plainHeader>{{ col.label }}</ng-template>
        </ng-template>

        <ng-template #colTemplate let-row="row" let-col="col">
          <ng-container [ngSwitch]="col.key">
            <ng-container *ngSwitchCase="'select'">
              <input
                type="checkbox"
                class="h-3.5 w-3.5 rounded text-primary"
                [checked]="isSelected(row.id)"
                (change)="toggleRowSelect(row.id, $event)"
                [attr.aria-label]="'Select ' + row.name" />
            </ng-container>
            <ng-container *ngSwitchCase="'name'">
              <a href="javascript:void(0)" class="ov-link font-semibold" (click)="$event.preventDefault()">
                {{ row.name }}
              </a>
            </ng-container>
            <ng-container *ngSwitchCase="'actions'">
              <div class="archives-actions">
                <button
                  type="button"
                  class="ov-icon-btn ov-icon-btn--bare"
                  (click)="restoreRow(row)"
                  aria-label="Restore"
                  data-tooltip="Restore">
                  <img src="assets/images/archives/restore.svg" alt="" width="16" height="16" />
                </button>
                <button
                  type="button"
                  class="ov-icon-btn ov-icon-btn--bare ov-icon-btn--danger"
                  (click)="deleteRow(row)"
                  aria-label="Delete permanently"
                  data-tooltip="Delete">
                  <img src="assets/images/work-order-detail/trash-red.svg" alt="" width="14" height="14" />
                </button>
              </div>
            </ng-container>
          </ng-container>
        </ng-template>
      </app-shared-table>
    </div>
  </div>
</div>
