<!-- Purchase Order List — Figma 3150:134570 -->
<div>
  <div class="page-header !py-4 flex flex-col gap-5 md:flex-row md:items-start md:justify-between">
    <div>
      <h3 class="ov-page-title">Purchase Order</h3>
      <p class="ov-page-sub">Manage and view all Purchase Order</p>
    </div>
    <div class="mt-2 md:mt-0 flex flex-wrap items-center gap-2">
      <button type="button" class="ov-btn ov-btn-primary" (click)="navigateToCreate()">
        <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
        {{ 'web.facility.purchaseOrders.addItem' | translate }}
      </button>
    </div>
  </div>

  <div class="box mb-5 overflow-visible rounded-2xl border border-defaultborder bg-white shadow-none dark:bg-bodybg">
    <div class="ov-toolbar !h-auto min-h-10 !border-b-0 !px-5 !pt-5 !pb-0 flex-col items-stretch sm:flex-row sm:items-center">
      <div class="ov-search max-w-none flex-1 sm:max-w-[437px]">
        <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
        <input type="text" class="ov-input ov-search__input"
          [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" (input)="pageNo = 0" placeholder="Search">
      </div>
      <div class="ov-toolbar__btns">
        <div class="relative" data-po-columns (click)="$event.stopPropagation()">
          <button type="button" class="ov-btn ov-btn-toolbar" (click)="toggleColumnDropdown($event)">
            <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
            Column
          </button>
          <app-column-menu
            *ngIf="showColumnDropdown"
            [columns]="tableColumns"
            (toggle)="toggleColumn($event)"
            (toggleAll)="toggleAllColumns($event)"
            (closed)="showColumnDropdown = false">
          </app-column-menu>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto px-5 pb-0 pt-5">
      <app-shared-table
        [columns]="visibleColumns"
        [data]="allRows"
        [loading]="false"
        [hasActions]="false"
        [showPaginator]="false"
        [totalRecords]="totalRecords"
        [pageSizeOptions]="pageSizeOptions"
        [pageSize]="pageSize"
        [pageIndex]="pageNo">
        <ng-template #colTemplate let-row="row" let-col="col">
          <ng-container [ngSwitch]="col.key">
            <a *ngSwitchCase="'code'" class="ov-link font-semibold"
              [routerLink]="['/facility/purchase-orders', row.code]"
              (click)="closeRowAction()">{{ row.code }}</a>
            <a *ngSwitchCase="'po_no'" class="ov-link"
              [routerLink]="['/facility/purchase-orders', row.code]"
              (click)="closeRowAction()">{{ row.po_no }}</a>
            <span *ngSwitchCase="'status'"
              class="ov-status"
              [class.ov-status--outline]="row.status === 'Draft'"
              [class.ov-status--soft]="row.status === 'Open'"
              [class.ov-status--active]="row.status === 'Approved'"
              [class.ov-status--blocked]="row.status === 'Closed' || row.status === 'Rejected'">
              {{ row.status }}
            </span>
            <span *ngSwitchCase="'total_amount'" class="font-semibold text-defaulttextcolor">{{ row.total_amount }}</span> 
            <a *ngSwitchCase="'property'"  class="ov-link" [routerLink]="['/properties', row.property_code]">{{ row.property }}</a>
            <a *ngSwitchCase="'unit_code'"  class="ov-link" [routerLink]="['/units', row.unitcode]">{{ row.unit_code }}</a> 
            <a *ngSwitchCase="'vendor'" class="ov-link" [routerLink]="['/units', row.vendor_code]" href="javascript:void(0)">{{ row.vendor }}</a>
            <div *ngSwitchCase="'action'" class="po-action" data-po-action (click)="$event.stopPropagation()">
              <button type="button" class="ov-icon-btn ov-icon-btn--bare" aria-label="Row actions"
                [attr.aria-expanded]="openRowActionId === row.id"
                (mousedown)="$event.stopPropagation()"
                (click)="toggleRowAction(row.id, $event)">
                <img src="assets/images/common/dots-vertical.svg" alt="" width="20" height="20" class="ov-action-ico" />
              </button>
            </div>
            <span *ngSwitchDefault>{{ row[col.key] }}</span>
          </ng-container>
        </ng-template>
      </app-shared-table>
    </div>
    <app-ov-paginator
    [totalRecords]="totalRecords"
    [pageSize]="pageSize"
    [pageIndex]="pageNo"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPaginatorChange($event)">
  </app-ov-paginator>
  </div>

  <div *ngIf="openRowActionId && rowMenuStyle"
    class="po-row-menu bg-white dark:bg-bodybg"
    role="menu"
    data-po-action
    [ngStyle]="rowMenuStyle"
    (click)="$event.stopPropagation()">
    <button type="button" role="menuitem" class="po-row-menu__item" (click)="navigateToCreate()">Edit</button>
    <a role="menuitem" class="po-row-menu__item"
      [routerLink]="['/facility/purchase-orders', openRowActionId!]"
      (click)="closeRowAction()">View</a>
  </div>
</div>
