<!-- Asset List Page -->
<div class="block justify-between page-header md:flex mb-6 items-center">
  <div class="flex items-center gap-3">
    <div>
      <h3 class="!text-defaulttextcolor dark:!text-defaulttextcolor/70 text-[1.5rem] font-semibold mb-1">
        Assets
      </h3>
      <ol class="flex items-center whitespace-nowrap text-[0.75rem] text-gray-500">
        <li class="hover:text-primary cursor-pointer">Facility</li>
        <li class="px-2 text-gray-400">/</li>
        <li class="font-semibold text-defaulttextcolor dark:text-white/70">Assets</li>
      </ol>
    </div>
  </div>
  <div class="flex gap-1.5 items-center mt-2 md:mt-0">
    <button type="button"
      class="w-8 h-8 rounded-md bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white hover:border-primary transition-all duration-200 shadow-sm"
      [attr.data-tooltip]="'Report'">
      <i class="ri-bar-chart-2-fill text-sm"></i>
    </button>
    <button type="button" (click)="navigateToCreate()"
      class="ti-btn bg-primary hover:bg-primary-hover text-white text-xs font-bold w-8 h-8 !px-0 rounded-md flex items-center justify-center shadow-sm"
      [attr.data-tooltip]="'Add Asset'">
      <i class="ri-add-line text-sm"></i>
    </button>
  </div>
</div>


<!-- Main card -->
<div class="box bg-white rounded-xl shadow-sm border border-gray-100 !mb-2">
  
  <div class="box-header p-4 border-b border-gray-100 flex items-center justify-between">
    <h6 class="box-title font-semibold text-gray-800 text-sm mb-0.5">Assets list</h6>
    <div class="flex items-center gap-3">
      <div class="input-group w-56">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          placeholder="Search..."
          class="form-control !text-[11px] !py-1.5 bg-gray-50 border-gray-200"
        />
        <button type="button" (click)="onSearch()"
          class="input-group-text bg-primary/10 text-primary border-s-0 hover:bg-primary/20 transition-colors">
          <i class="ri-search-line"></i>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <!-- Filter Button -->
        <button type="button" (click)="toggleDrawer(true)"
          class="w-8 h-8 rounded-md bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white hover:border-primary transition-all duration-200 shadow-sm"
          [attr.data-tooltip]="'web.dashboard.lblFilters' | translate">
          <i class="ri-filter-3-line text-[0.9rem] align-middle"></i>
        </button>

        <!-- Column Button with dropdown overlay -->
        <div class="relative">
          <button type="button" (click)="showColumnDropdown = !showColumnDropdown"
            class="w-8 h-8 rounded-md bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white hover:border-primary transition-all duration-200 shadow-sm"
            [attr.data-tooltip]="'Columns'">
            <i class="ri-menu-add-line text-[0.9rem] align-middle"></i>
          </button>

          <!-- Column toggling checklist dropdown overlay -->
          <div *ngIf="showColumnDropdown"
            class="absolute right-0 mt-1.5 z-30 bg-white border border-gray-200 rounded-lg shadow-lg p-3 min-w-[180px] flex flex-col gap-2 animate-fade-in">
            <label
              class="flex items-center gap-2 cursor-pointer font-bold text-gray-700 text-[10px]  border-b pb-1.5 mb-1">
              <input type="checkbox" [checked]="allColumnsSelected" (change)="toggleAllColumns($event)"
                class="form-checkbox h-3.5 w-3.5 text-primary rounded">
              Select All
            </label>
            <div class="flex flex-col gap-1.5 max-h-48 overflow-y-auto">
              <label *ngFor="let col of tableColumns"
                class="flex items-center gap-2 cursor-pointer text-gray-600 text-xs hover:text-gray-900 transition-colors">
                <input type="checkbox" [checked]="col.visible" (change)="toggleColumn(col.key)"
                  class="form-checkbox h-3.5 w-3.5 text-primary rounded">
                {{ col.label }}
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="p-4">
    <app-shared-table 
      [columns]="visibleColumns" 
      [data]="assetData" 
      [hasActions]="true" 
      [totalRecords]="totalRecords" 
      [pageSize]="pageSize"
      [pageIndex]="pageNo"
      (pageChange)="onSharedTablePageChange($event)"
      (notify_edit_action)="handleEditAction($event)">
      <ng-template #colTemplate let-row="row" let-col="col">
        <ng-container [ngSwitch]="col.key">
          
          <!-- ID Column -->
          <ng-container *ngSwitchCase="'id'">
            <span (click)="navigateToDetail(row.code)" class="text-primary font-semibold hover:underline cursor-pointer transition-all">{{ row.code || row.id }}</span>
          </ng-container>
  
          <!-- Category Column -->
          <ng-container *ngSwitchCase="'category'">
            <span>{{ getArabicLookupName(row, 'category') }}</span>
          </ng-container>
  
          <!-- Property Column -->
          <ng-container *ngSwitchCase="'property'">
            <span>{{ getArabicLookupName(row, 'property') }}</span>
          </ng-container>
  
          <!-- Status Column -->
          <ng-container *ngSwitchCase="'status'">
            <span *ngIf="row.status === 'Operational'" class="px-2.5 py-1 rounded bg-[#1f2b45] text-[10px] font-bold text-white shadow-sm">Operational</span>
            <span *ngIf="row.status === 'Down'" class="px-2.5 py-1 rounded bg-danger text-[10px] font-bold text-white shadow-sm">Down</span>
          </ng-container>
  
          <!-- Action Column -->
          <ng-container *ngSwitchCase="'action'">
            <div class="flex gap-1">
              <button (click)="handleEditAction(row)" class="w-7 h-7 rounded-md bg-primary/10 text-primary border-0 flex items-center justify-center hover:bg-primary hover:text-white transition-all duration-200" data-tooltip="Edit">
                <i class="ri-edit-line text-xs"></i>
              </button>
              <button class="w-7 h-7 rounded-md bg-danger/10 text-danger border-0 flex items-center justify-center hover:bg-danger hover:text-white transition-all duration-200" data-tooltip="Delete">
                <i class="ri-delete-bin-line text-xs"></i>
              </button>
            </div>
          </ng-container>
  
        </ng-container>
      </ng-template>
    </app-shared-table>
  </div>
</div>

<!-- Sliding Filter Drawer -->
<app-filter-drawer [(isOpen)]="isDrawerOpen" (apply)="onSearch()" (clear)="clearFilters()">
  <div class="flex flex-col gap-4 text-[11px]">
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by Name</label>
      <input type="text" class="form-control form-control-sm !text-[11px] bg-gray-50 border-gray-200"
        [(ngModel)]="filterName" placeholder="Enter name">
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by Category</label>
      <ng-select [(ngModel)]="filterCategory" [items]="assetCategories" bindLabel="name" bindValue="id" [searchable]="true" [clearable]="true"
        placeholder="Select Category" class="ng-select-sm w-full" appendTo="body"></ng-select>
    </div>
    <div class="flex flex-col">
      <label class="form-label font-semibold text-gray-600 mb-1.5 block">Filter by Status</label>
      <ng-select [(ngModel)]="filterStatus" [items]="statusOptions" [searchable]="true" [clearable]="true"
        placeholder="Select Status" class="ng-select-sm w-full" appendTo="body"></ng-select>
    </div>
  </div>
</app-filter-drawer>
