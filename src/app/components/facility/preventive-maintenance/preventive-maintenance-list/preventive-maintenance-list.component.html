<!-- Preventive Maintenance List — Figma 3063:79251 -->
<div>
  <div class="page-header !py-4 flex flex-col gap-5 md:flex-row md:items-start md:justify-between">
    <div>
      <h3 class="ov-page-title">{{ 'web.facility.preventiveMaintenance.title' | translate }}</h3>
      <p class="ov-page-sub">{{ 'web.facility.preventiveMaintenance.subtitle' | translate }}</p>
    </div>
    <div class="mt-2 md:mt-0 flex flex-wrap items-center gap-2">
      <button type="button" class="ov-btn ov-btn-primary" (click)="navigateToCreate()">
        <img src="assets/images/work-orders/plus.svg" alt="" width="18" height="18" />
        {{ 'web.facility.preventiveMaintenance.addPM' | translate }}
      </button>
    </div>
  </div>

  <div class="box mb-5 overflow-visible rounded-2xl border border-defaultborder bg-white shadow-none dark:bg-bodybg">
    <div class="ov-toolbar !h-auto min-h-10 !border-b-0 !px-5 !pt-5 !pb-0 flex-col items-stretch sm:flex-row sm:items-center">
      <div class="ov-search max-w-none flex-1 sm:max-w-[437px]">
        <img src="assets/images/work-orders/search.svg" alt="" width="15" height="15" class="ov-search__icon" />
        <input type="text" class="ov-input ov-search__input"
          [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" (input)="pageIndex = 0" [placeholder]="'web.facility.preventiveMaintenance.phSearch' | translate">
      </div>
      <div class="ov-toolbar__btns">
        <div class="relative" data-pm-columns (click)="$event.stopPropagation()">
          <button type="button" class="ov-btn ov-btn-toolbar" (click)="toggleColumnDropdown($event)">
            <img src="assets/images/work-orders/columns.svg" alt="" width="18" height="18" />
            {{ 'web.facility.preventiveMaintenance.column' | translate }}
          </button>
          <app-column-menu
            *ngIf="showColumnDropdown"
            [columns]="tableColumns"
            (toggle)="toggleColumn($event)"
            (toggleAll)="toggleAllColumns($event)"
            (closed)="showColumnDropdown = false">
          </app-column-menu>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto px-5 pb-0 pt-5">
      <app-shared-table [columns]="visibleColumns" [data]="allRows" [loading]="false"
      [totalRecords]="totalRecords" [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize" [pageIndex]="pageNo"
      (pageChange)="onSharedTablePageChange($event)"   [hasActions]="false" [showPaginator]="false">
        <ng-template #colTemplate let-row="row" let-col="col">
          <ng-container [ngSwitch]="col.key">
            <a *ngSwitchCase="'code'" class="ov-link" href="javascript:void(0)"
              (click)="navigateToDetail(row.code)">{{ row.code }}</a>
            <a *ngSwitchCase="'title'"  (click)="navigateToDetail(row.code)" class="ov-link" href="javascript:void(0)">{{ row.title }}</a>
            
            <span *ngSwitchCase="'status_nm'" class="tk-chip" [ngClass]="statusClass(row.status_nm)">
              {{ row.status_nm }}
            </span>
            <span *ngSwitchCase="'property'" class="tk-chip tk-chip--soft"> 
              <a class="ov-link font-semibold" [routerLink]="['/properties', row.property_code]">{{ row.property }}</a>
            </span> 
            <span *ngSwitchCase="'unitcode'" class="tk-chip tk-chip--soft"> 
              <a class="ov-link font-semibold" [routerLink]="['/properties', row.unit_code]">{{ row.unitcode }}</a>
            </span> 
            <span *ngSwitchCase="'vendor'" class="tk-chip tk-chip--soft"> 
              <a class="ov-link font-semibold" [routerLink]="['/contacts/vendors', row.vendor_code]">{{ row.vendor }}</a>
            </span> 
            <div *ngSwitchCase="'action'" class="tk-action" data-tickets-action
              (click)="$event.stopPropagation()">
              <button type="button" class="ov-icon-btn ov-icon-btn--bare" aria-label="Row actions"
                [attr.aria-expanded]="openRowActionId === row.code"
                (mousedown)="$event.stopPropagation()"
                (click)="toggleRowAction(row.code, $event)">
                <img src="assets/images/common/dots-vertical.svg" alt="" width="20" height="20" class="ov-action-ico" />
              </button>
            </div>
            <span *ngSwitchDefault>{{ row[col.key] }}</span>
          </ng-container>
        </ng-template>
      </app-shared-table>
    </div>

    <app-ov-paginator
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageNo"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onPaginatorChange($event)">
    </app-ov-paginator>
  </div>

  <div *ngIf="openRowActionId && rowMenuStyle"
    class="pm-row-menu bg-white dark:bg-bodybg"
    role="menu"
    data-pm-action
    [ngStyle]="rowMenuStyle"
    (click)="$event.stopPropagation()">
    <button type="button" role="menuitem" class="pm-row-menu__item" (click)="navigateToEdit(openRowActionId)">{{ 'web.facility.preventiveMaintenance.edit' | translate }}</button>
    <button type="button" role="menuitem" class="pm-row-menu__item" (click)="navigateToDetail(openRowActionId)">{{ 'web.facility.preventiveMaintenance.view' | translate }}</button>
  </div>
</div>
