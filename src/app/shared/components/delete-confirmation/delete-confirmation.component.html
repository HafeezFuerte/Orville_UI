<div
  class="ov-modal-backdrop ov-confirm"
  role="dialog"
  aria-modal="true"
  aria-labelledby="ov-confirm-title"
  (click)="onCancel()">
  <div class="ov-modal-stack ov-confirm__stack" (click)="$event.stopPropagation()">
    <button type="button" class="ov-modal__float-close" (click)="onCancel()" aria-label="Close">
      <img src="assets/images/common/close-plus.svg" alt="" width="20" height="20" class="ov-ico-x" />
    </button>

    <div class="ov-modal ov-modal--sm ov-confirm__card">
      <div class="ov-confirm__accent" aria-hidden="true"></div>

      <div class="ov-confirm__body">
        <span class="ov-confirm__icon" aria-hidden="true">
          <img src="assets/images/settings/file-alert.svg" alt="" width="28" height="28" />
        </span>

        <h4 id="ov-confirm-title" class="ov-confirm__title">{{ title | translate }}</h4>
        <p class="ov-confirm__message">{{ message | translate }}</p>

        <div class="ov-confirm__actions">
          <button type="button" class="ov-btn ov-btn-ghost" (click)="onCancel()">
            {{ cancelText | translate }}
          </button>
          <button type="button" class="ov-btn ov-confirm__yes" (click)="onConfirm()">
            {{ confirmText | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
