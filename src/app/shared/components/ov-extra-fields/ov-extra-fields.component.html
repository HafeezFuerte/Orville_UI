<div class="ov-card" *ngIf="hasFields()">
  <div class="ov-card__head">
    <h6 class="ov-card-title">{{ cardTitle | translate }}</h6>
    <p class="ov-card-sub">{{ cardSubtitle | translate }}</p>
  </div>
  <div class="ov-card__body grid grid-cols-1 md:grid-cols-2 gap-4">
    <div *ngFor="let cf of extraFields" class="flex flex-col gap-2">
      <label class="ov-label" [for]="'cf-' + cf.column_name">
        {{ cf.alias_name || cf.column_name }}
        <span *ngIf="cf.is_mandatory" class="text-danger">*</span>
      </label>

      <!-- Textbox -->
      <input *ngIf="cf.control_type === 'TX' || !cf.control_type"
        [id]="'cf-' + cf.column_name"
        [name]="cf.column_name"
        type="text"
        class="ov-input"
        [readonly]="isEdit ? !!cf.is_readonly : false"
        [placeholder]="'web.property.lblEnter' | translate"
        [(ngModel)]="extraFieldValues[cf.column_name]"
        (ngModelChange)="onValueChange()"
        [ngModelOptions]="{standalone: true}">

      <!-- Numeric -->
      <input *ngIf="cf.control_type === 'NM'"
        [id]="'cf-' + cf.column_name"
        [name]="cf.column_name"
        type="number"
        class="ov-input"
        [readonly]="isEdit ? !!cf.is_readonly : false"
        [placeholder]="'0'"
        [(ngModel)]="extraFieldValues[cf.column_name]"
        (ngModelChange)="onValueChange()"
        [ngModelOptions]="{standalone: true}">

      <!-- Date -->
      <input *ngIf="cf.control_type === 'DT'"
        [id]="'cf-' + cf.column_name"
        [name]="cf.column_name"
        type="date"
        class="ov-input"
        [readonly]="isEdit ? !!cf.is_readonly : false"
        [(ngModel)]="extraFieldValues[cf.column_name]"
        (ngModelChange)="onValueChange()"
        [ngModelOptions]="{standalone: true}">

      <!-- Time -->
      <input *ngIf="cf.control_type === 'TI'"
        [id]="'cf-' + cf.column_name"
        [name]="cf.column_name"
        type="time"
        class="ov-input"
        [readonly]="isEdit ? !!cf.is_readonly : false"
        [(ngModel)]="extraFieldValues[cf.column_name]"
        (ngModelChange)="onValueChange()"
        [ngModelOptions]="{standalone: true}">

      <!-- Select / Dropdown -->
      <select *ngIf="cf.control_type === 'DL' || cf.control_type === 'DP'"
        [id]="'cf-' + cf.column_name"
        [name]="cf.column_name"
        class="ov-input cursor-pointer"
        [disabled]="isEdit ? !!cf.is_readonly : false"
        [(ngModel)]="extraFieldValues[cf.column_name]"
        (ngModelChange)="onValueChange()"
        [ngModelOptions]="{standalone: true}">
        <option value="">{{ 'web.property.lblSelect' | translate }}</option>
        <ng-container *ngIf="cf.control_type === 'DP' && getLookupOptions(cf.dependency_type || cf.dependencyType || cf.dependency_id).length > 0; else dlOpts">
          <option *ngFor="let opt of getLookupOptions(cf.dependency_type || cf.dependencyType || cf.dependency_id)" [value]="opt.name || opt.code">
            {{ opt.name }}
          </option>
        </ng-container>
        <ng-template #dlOpts>
          <option *ngFor="let opt of getProbableValuesList(cf.probable_values)" [value]="opt">{{ opt }}</option>
        </ng-template>
      </select>

      <!-- Checkbox -->
      <label *ngIf="cf.control_type === 'CK'" class="flex items-center gap-2 cursor-pointer mt-2">
        <input type="checkbox"
          [id]="'cf-' + cf.column_name"
          [name]="cf.column_name"
          class="form-checkbox h-4 w-4 rounded border-defaultborder text-primary"
          [disabled]="isEdit ? !!cf.is_readonly : false"
          [(ngModel)]="extraFieldValues[cf.column_name]"
          (ngModelChange)="onValueChange()"
          [ngModelOptions]="{standalone: true}">
        <span class="text-xs text-defaulttextcolor">{{ cf.alias_name }}</span>
      </label>

      <!-- File Upload (FU) -->
      <div *ngIf="cf.control_type === 'FU'" class="flex flex-col gap-1.5">
        <input
          [id]="'cf-' + cf.column_name"
          type="file"
          class="ov-input file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-primary file:text-white cursor-pointer"
          [disabled]="isEdit ? !!cf.is_readonly : false"
          (change)="onFileSelected($event, cf.column_name, false)">
        <span *ngIf="fileNamesMap[cf.column_name] || extraFieldValues[cf.column_name]" class="text-xs text-textmuted truncate">
          {{ fileNamesMap[cf.column_name] || extraFieldValues[cf.column_name] }}
        </span>
      </div>

      <!-- Image (IM) -->
      <div *ngIf="cf.control_type === 'IM'" class="flex flex-col gap-2">
        <input
          [id]="'cf-' + cf.column_name"
          type="file"
          accept="image/*"
          class="ov-input file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-primary file:text-white cursor-pointer"
          [disabled]="isEdit ? !!cf.is_readonly : false"
          (change)="onFileSelected($event, cf.column_name, true)">
        <img *ngIf="imagePreviewMap[cf.column_name] || extraFieldValues[cf.column_name]"
          [src]="imagePreviewMap[cf.column_name] || extraFieldValues[cf.column_name]"
          alt="Preview"
          class="h-20 w-20 object-cover rounded border border-defaultborder">
      </div>

      <!-- Radio Button -->
      <div *ngIf="cf.control_type === 'RB'" class="flex flex-wrap gap-4 mt-2">
        <label *ngFor="let opt of getProbableValuesList(cf.probable_values)" class="flex items-center gap-2 cursor-pointer">
          <input type="radio"
            [name]="'cf-' + cf.column_name"
            [value]="opt"
            [disabled]="isEdit ? !!cf.is_readonly : false"
            [(ngModel)]="extraFieldValues[cf.column_name]"
            (ngModelChange)="onValueChange()"
            [ngModelOptions]="{standalone: true}">
          <span class="text-xs text-defaulttextcolor">{{ opt }}</span>
        </label>
      </div>
    </div>
  </div>
</div>
