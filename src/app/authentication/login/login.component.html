<div class="orville-login">
  <!-- Left: navy panel + isometric illustration (Figma) -->
  <aside class="orville-login__panel" aria-hidden="true">
    <div class="orville-login__panel-bg"></div>
    <div class="orville-login__illustration-wrap">
      <img
        class="orville-login__illustration"
        src="assets/images/auth/login-illustration.jpg"
        alt=""
      />
    </div>
    <div class="orville-login__panel-overlay"></div>
  </aside>

  <!-- Right: form -->
  <main class="orville-login__main">
    <div class="orville-login__form-shell">
      <div class="orville-login__brand">
        <img
          class="orville-login__brand-emblem"
          src="assets/images/auth/logo-emblem.svg"
          alt="Orville"
        />
        <div class="orville-login__brand-wordmark">
          <img
            class="orville-login__brand-orville"
            src="assets/images/auth/logo-orville.svg"
            alt="ORVILLE"
          />
          <img
            class="orville-login__brand-tagline"
            src="assets/images/auth/logo-real-estate.svg"
            alt="Real Estate"
          />
        </div>
      </div>

      <div class="orville-login__intro">
        <h1 class="orville-login__title">Welcome Back</h1>
        <p class="orville-login__subtitle">
          Sign in to access your property management dashboard.
        </p>
      </div>

      <form class="orville-login__form" [formGroup]="loginForm" (ngSubmit)="login()">
        <div *ngIf="error" class="orville-login__error" role="alert">
          <i class="ri-error-warning-line"></i>
          <span>{{ error }}</span>
        </div>

        <div class="orville-login__field">
          <label class="orville-login__label" for="login-email">Email</label>
          <input
            id="login-email"
            type="text"
            formControlName="username"
            placeholder="Enter your email"
            class="orville-login__input"
            autocomplete="username"
          />
        </div>

        <div class="orville-login__field">
          <label class="orville-login__label" for="login-password">Password</label>
          <div class="orville-login__input-wrap">
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
              class="orville-login__input orville-login__input--password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="orville-login__eye"
              (click)="toggleVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <img
                *ngIf="!showPassword"
                src="assets/images/auth/eye-off.svg"
                alt=""
                width="16"
                height="16"
              />
              <img
                *ngIf="showPassword"
                src="assets/images/auth/eye.svg"
                alt=""
                width="16"
                height="16"
              />
            </button>
          </div>
        </div>

        <div class="orville-login__row">
          <label class="orville-login__remember">
            <input type="checkbox" class="orville-login__checkbox" />
            <span>Remember me</span>
          </label>
          <a
            routerLink="/authentication/reset-password/basic"
            class="orville-login__forgot"
          >Forgot Password?</a>
        </div>

        <button
          type="submit"
          class="orville-login__submit"
          [disabled]="isLoading"
        >
          <span
            *ngIf="isLoading"
            class="orville-login__spinner"
            aria-hidden="true"
          ></span>
          Login
        </button>
      </form>

      <p class="orville-login__copyright">
        © 2026 Orville Real Estate. All rights reserved.
      </p>
    </div>

    <div class="orville-login__footer">
      <a href="javascript:void(0)" class="orville-login__footer-link">Help</a>
      <span class="orville-login__footer-sep" aria-hidden="true">|</span>
      <a href="javascript:void(0)" class="orville-login__footer-link">Privacy</a>
    </div>
  </main>
</div>
