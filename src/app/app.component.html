<router-outlet></router-outlet>

<!-- Premium Global Loading Spinner Overlay -->
<div *ngIf="loading$ | async" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/25 backdrop-blur-[2px] transition-all duration-300">
  <div class="flex flex-col items-center gap-3 p-6 rounded-2xl bg-white/95 dark:bg-slate-900/95 shadow-2xl border border-white/20">
    <div class="relative w-12 h-12">
      <!-- Outer Ring -->
      <div class="absolute inset-0 rounded-full border-4 border-primary/20"></div>
      <!-- Spinning Ring -->
      <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-primary animate-spin"></div>
    </div>
    <span class="text-xs font-bold text-gray-700 dark:text-gray-200 tracking-wider uppercase">Loading...</span>
  </div>
</div>
